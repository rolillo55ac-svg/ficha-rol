<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Krysalis · Crónicas y Fichas de Rol v1.0</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>

<body>
  <div id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="loading-content">
      <div class="loading-emblem-wrap">
        <div class="loading-rune-ring"></div>
        <div class="loading-glow"></div>
        <svg class="loading-emblem" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"
          aria-label="Emblema Rúnico de Krysalis">
          <defs>
            <radialGradient id="gemGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#FF8A96" />
              <stop offset="40%" stop-color="#C84B57" />
              <stop offset="80%" stop-color="#8C252F" />
              <stop offset="100%" stop-color="#3D0C11" />
            </radialGradient>
            <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#DEC392" stop-opacity="0.25" />
              <stop offset="70%" stop-color="#8C252F" stop-opacity="0.12" />
              <stop offset="100%" stop-color="#120D0A" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF5DC" />
              <stop offset="25%" stop-color="#DEC392" />
              <stop offset="65%" stop-color="#B08D57" />
              <stop offset="100%" stop-color="#6E4F23" />
            </linearGradient>
            <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#553A15" />
              <stop offset="50%" stop-color="#91703C" />
              <stop offset="100%" stop-color="#DEC392" />
            </linearGradient>
            <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3.5" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Resplandor místico de fondo -->
          <circle cx="100" cy="100" r="90" fill="url(#ringGlow)" />

          <!-- Anillos concéntricos ornamentales antiguos -->
          <circle cx="100" cy="100" r="92" stroke="url(#goldDark)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.45" />
          <circle cx="100" cy="100" r="86" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.8" />
          <circle cx="100" cy="100" r="80" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.4" />

          <!-- Ticks cardinales de compás / astrolabio -->
          <polygon points="100,6 103,16 100,14 97,16" fill="url(#goldGrad)" />
          <polygon points="100,194 103,184 100,186 97,184" fill="url(#goldGrad)" />
          <polygon points="6,100 16,103 14,100 16,97" fill="url(#goldGrad)" />
          <polygon points="194,100 184,103 186,100 184,97" fill="url(#goldGrad)" />

          <!-- Puntos cardinales diagonales -->
          <circle cx="35" cy="35" r="1.5" fill="url(#goldGrad)" opacity="0.6" />
          <circle cx="165" cy="35" r="1.5" fill="url(#goldGrad)" opacity="0.6" />
          <circle cx="35" cy="165" r="1.5" fill="url(#goldGrad)" opacity="0.6" />
          <circle cx="165" cy="165" r="1.5" fill="url(#goldGrad)" opacity="0.6" />

          <!-- ================= RUNA SAGRADA DE KRYSALIS ================= -->
          <!-- Gancho Superior Izquierdo -->
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="#C84B57" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55" filter="url(#goldGlow)" />
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="url(#goldDark)" stroke-width="5.2" stroke-linecap="round" fill="none" />
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="#FFF8E7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />

          <!-- Gancho Inferior Derecho (Rotación C2 180° perfecta) -->
          <g transform="rotate(180 100 100)">
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="#C84B57" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55" filter="url(#goldGlow)" />
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="url(#goldDark)" stroke-width="5.2" stroke-linecap="round" fill="none" />
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="#FFF8E7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />
          </g>

          <!-- Círculo / Medallón Superior Derecho (124, 70) -->
          <circle cx="124" cy="70" r="14" fill="#1A120D" stroke="#C84B57" stroke-width="3" opacity="0.6" filter="url(#goldGlow)" />
          <circle cx="124" cy="70" r="13" fill="#1A120D" stroke="url(#goldGrad)" stroke-width="2.4" />
          <circle cx="124" cy="70" r="9" fill="url(#gemGrad)" stroke="url(#goldDark)" stroke-width="1" />
          <!-- Facetas y destello de gema -->
          <circle cx="121.5" cy="67.5" r="2.2" fill="#FFFFFF" opacity="0.9" />
          <circle cx="127" cy="73" r="1" fill="#FF8A96" opacity="0.6" />

          <!-- Círculo / Medallón Inferior Izquierdo (76, 130) (Rotación C2 180° perfecta) -->
          <g transform="rotate(180 100 100)">
            <circle cx="124" cy="70" r="14" fill="#1A120D" stroke="#C84B57" stroke-width="3" opacity="0.6" filter="url(#goldGlow)" />
            <circle cx="124" cy="70" r="13" fill="#1A120D" stroke="url(#goldGrad)" stroke-width="2.4" />
            <circle cx="124" cy="70" r="9" fill="url(#gemGrad)" stroke="url(#goldDark)" stroke-width="1" />
            <circle cx="121.5" cy="67.5" r="2.2" fill="#FFFFFF" opacity="0.9" />
            <circle cx="127" cy="73" r="1" fill="#FF8A96" opacity="0.6" />
          </g>

          <!-- Nexo Central de Energía Arcana -->
          <circle cx="100" cy="100" r="4.5" fill="url(#gemGrad)" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#subtleGlow)" />
          <circle cx="98.5" cy="98.5" r="1.2" fill="#FFFFFF" opacity="0.9" />
          <polygon points="100,92 101.5,99 108,100 101.5,101 100,108 98.5,101 92,100 98.5,99" fill="url(#goldGrad)" opacity="0.8" />
        </svg>
      </div>

      <div class="loading-titles">
        <h1 class="loading-brand">KRYSALIS</h1>
        <div class="loading-sub">CRÓNICAS &middot; FICHAS DE ROL</div>
        <div class="loading-version">v1.0.0</div>
      </div>

      <div class="loading-bar-wrap">
        <div class="loading-bar-track">
          <div class="loading-bar-fill" id="loadingBarFill"></div>
        </div>
        <div class="loading-status" id="loadingStatusText">Cargando partida...</div>
      </div>
    </div>
  </div>

  <div id="app">
    <header class="topbar" id="topbar"></header>
    <nav class="tabbar" id="tabbar"></nav>
    <main id="main"></main>
    <button class="fab-dice" id="fabDice" title="Lanzar dados" aria-label="Lanzar dados">🎲</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="swipe-indicator" id="swipeIndicator">Desliza para cambiar de pestaña</div>

  <div class="modal-overlay hidden" id="charModalOverlay">
    <div class="modal" id="charModal"></div>
  </div>
  <div class="modal-overlay hidden" id="diceModalOverlay">
    <div class="modal" id="diceModal"></div>
  </div>
  <div class="modal-overlay hidden" id="dataModalOverlay">
    <div class="modal" id="dataModal"></div>
  </div>
  <div class="modal-overlay hidden" id="pinModalOverlay">
    <div class="modal" id="pinModal"></div>
  </div>
  <div class="modal-overlay hidden" id="loreModalOverlay">
    <div class="modal" id="loreModal"></div>
  </div>
  <div class="modal-overlay hidden" id="conflictModalOverlay">
    <div class="modal" id="conflictModal"></div>
  </div>
  <div class="roll-overlay hidden" id="rollOverlay">
    <div class="roll-box">
      <div class="cup-stage" id="cupStage"></div>
      <div class="roll-result-stage" id="rollResultStage">
        <div id="rollLabel" style="font-family:var(--font-display);font-size:.95rem;color:var(--gold-light);"></div>
        <div id="rollDieGraphic" style="display:flex;justify-content:center;margin:8px 0;"></div>
        <div id="rollAdvVisual"></div>
        <div class="roll-score" id="rollScore"></div>
        <div id="rollVerdict"
          style="font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;font-weight:700;">
        </div>
        <div id="rollDetail" style="font-size:.8rem;color:var(--ink-dim);line-height:1.4;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn-compact" data-action="reroll-last-dice" style="flex:1;">🎲 Volver a Tirar</button>
          <button class="btn-solid-gold" data-action="close-roll-modal" style="flex:1;">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="portraitFileInput" accept="image/*" hidden>
  <input type="file" id="mapFileInput" accept="image/*" hidden>
  <input type="file" id="bestiaryFileInput" accept="image/*" hidden>
  <input type="file" id="questFileInput" accept="image/*" hidden>
  <input type="file" id="importFileInput" accept="application/json" hidden>
  <script src="js/utils.js?v=1.0.2"></script>
  <script src="js/state.js?v=1.0.2"></script>
  <script src="js/supabase-client.js?v=1.0.2"></script>
  <script src="js/auth.js?v=1.0.2"></script>
  <script src="js/sync.js?v=1.0.2"></script>
  <script src="js/characters.js?v=1.0.2"></script>
  <script src="js/combat.js?v=1.0.2"></script>
  <script src="js/catalog.js?v=1.0.2"></script>
  <script src="js/bestiary.js?v=1.0.2"></script>
  <script src="js/maps.js?v=1.0.2"></script>
  <script src="js/markers.js?v=1.0.2"></script>
  <script src="js/quests.js?v=1.0.2"></script>
  <script src="js/dice.js?v=1.0.2"></script>
  <script src="js/ui-modals.js?v=1.0.2"></script>
  <script src="js/ui-render.js?v=1.0.2"></script>
  <script src="js/ui-events.js?v=1.0.2"></script>
  <script src="js/app.js?v=1.0.2"></script>
</body>

</html>
