<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Rol Krysalis - v1.2.4</title>

  <!-- Favicon e Iconos del Navegador -->
  <link rel="icon" type="image/svg+xml" href="images/krysalis-icon.svg?v=1.2.4">
  <link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png?v=1.2.4">
  <link rel="icon" type="image/png" sizes="16x16" href="images/icon-16.png?v=1.2.4">
  <link rel="shortcut icon" href="favicon.ico?v=1.2.4">

  <!-- Enlace directo en el móvil (iOS y Android) y PWA -->
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=1.2.4">
  <link rel="manifest" href="manifest.json?v=1.2.4">
  <meta name="theme-color" content="#120D0A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rol Krysalis">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>
  <div id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="loading-content">
      <div class="loading-emblem-wrap">
        <div class="loading-rune-ring"></div>
        <div class="loading-glow"></div>
        <svg class="loading-emblem" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"
          aria-label="Emblema Rúnico de Krysalis">
          <defs>
            <radialGradient id="gemGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#FF8A96" />
              <stop offset="40%" stop-color="#C84B57" />
              <stop offset="80%" stop-color="#8C252F" />
              <stop offset="100%" stop-color="#3D0C11" />
            </radialGradient>
            <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#DEC392" stop-opacity="0.25" />
              <stop offset="70%" stop-color="#8C252F" stop-opacity="0.12" />
              <stop offset="100%" stop-color="#120D0A" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF5DC" />
              <stop offset="25%" stop-color="#DEC392" />
              <stop offset="65%" stop-color="#B08D57" />
              <stop offset="100%" stop-color="#6E4F23" />
            </linearGradient>
            <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#553A15" />
              <stop offset="50%" stop-color="#91703C" />
              <stop offset="100%" stop-color="#DEC392" />
            </linearGradient>
            <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3.5" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Resplandor místico de fondo -->
          <circle cx="100" cy="100" r="90" fill="url(#ringGlow)" />

          <!-- Anillos concéntricos ornamentales antiguos -->
          <circle cx="100" cy="100" r="92" stroke="url(#goldDark)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.45" />
          <circle cx="100" cy="100" r="86" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.8" />
          <circle cx="100" cy="100" r="80" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.4" />

          <!-- Ticks cardinales de compás / astrolabio -->
          <polygon points="100,6 103,16 100,14 97,16" fill="url(#goldGrad)" />
          <polygon points="100,194 103,184 100,186 97,184" fill="url(#goldGrad)" />
          <polygon points="6,100 16,103 14,100 16,97" fill="url(#goldGrad)" />
          <polygon points="194,100 184,103 186,100 184,97" fill="url(#goldGrad)" />

          <!-- Puntos cardinales diagonales -->
          <circle cx="35" cy="35" r="1.5" fill="url(#goldGrad)" opacity="0.6" />
          <circle cx="165" cy="35" r="1.5" fill="url(#goldGrad)" opacity="0.6" />
          <circle cx="35" cy="165" r="1.5" fill="url(#goldGrad)" opacity="0.6" />
          <circle cx="165" cy="165" r="1.5" fill="url(#goldGrad)" opacity="0.6" />

          <!-- Emblema -->
          <!-- Gancho Superior Izquierdo -->
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="#C84B57" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55" filter="url(#goldGlow)" />
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="url(#goldDark)" stroke-width="5.2" stroke-linecap="round" fill="none" />
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
          <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
            stroke="#FFF8E7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />

          <!-- Gancho Inferior Derecho (Rotación C2 180° perfecta) -->
          <g transform="rotate(180 100 100)">
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="#C84B57" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55" filter="url(#goldGlow)" />
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="url(#goldDark)" stroke-width="5.2" stroke-linecap="round" fill="none" />
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
            <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
              stroke="#FFF8E7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />
          </g>

          <!-- Círculo / Medallón Superior Derecho (124, 70) -->
          <circle cx="124" cy="70" r="14" fill="#1A120D" stroke="#C84B57" stroke-width="3" opacity="0.6" filter="url(#goldGlow)" />
          <circle cx="124" cy="70" r="13" fill="#1A120D" stroke="url(#goldGrad)" stroke-width="2.4" />
          <circle cx="124" cy="70" r="9" fill="url(#gemGrad)" stroke="url(#goldDark)" stroke-width="1" />
          <!-- Facetas y destello de gema -->
          <circle cx="121.5" cy="67.5" r="2.2" fill="#FFFFFF" opacity="0.9" />
          <circle cx="127" cy="73" r="1" fill="#FF8A96" opacity="0.6" />

          <!-- Círculo / Medallón Inferior Izquierdo (76, 130) (Rotación C2 180° perfecta) -->
          <g transform="rotate(180 100 100)">
            <circle cx="124" cy="70" r="14" fill="#1A120D" stroke="#C84B57" stroke-width="3" opacity="0.6" filter="url(#goldGlow)" />
            <circle cx="124" cy="70" r="13" fill="#1A120D" stroke="url(#goldGrad)" stroke-width="2.4" />
            <circle cx="124" cy="70" r="9" fill="url(#gemGrad)" stroke="url(#goldDark)" stroke-width="1" />
            <circle cx="121.5" cy="67.5" r="2.2" fill="#FFFFFF" opacity="0.9" />
            <circle cx="127" cy="73" r="1" fill="#FF8A96" opacity="0.6" />
          </g>

          <!-- Nexo Central de Energía Arcana -->
          <circle cx="100" cy="100" r="4.5" fill="url(#gemGrad)" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#subtleGlow)" />
          <circle cx="98.5" cy="98.5" r="1.2" fill="#FFFFFF" opacity="0.9" />
          <polygon points="100,92 101.5,99 108,100 101.5,101 100,108 98.5,101 92,100 98.5,99" fill="url(#goldGrad)" opacity="0.8" />
        </svg>
      </div>

      <div class="loading-titles">
        <h1 class="loading-brand">ROL KRYSALIS</h1>
        <div class="loading-sub">CRÓNICAS &middot; FICHAS DE ROL</div>
        <div class="loading-version">v1.2.1</div>
      </div>

      <div class="loading-bar-wrap">
        <div class="loading-bar-track">
          <div class="loading-bar-fill" id="loadingBarFill"></div>
        </div>
        <div class="loading-status" id="loadingStatusText">Cargando partida...</div>
      </div>
    </div>
  </div>

  <div id="app">
    <header class="topbar" id="topbar"></header>
    <nav class="tabbar" id="tabbar"></nav>
    <main id="main"></main>
    <button class="fab-dice" id="fabDice" title="Lanzar dados" aria-label="Lanzar dados">🎲</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="swipe-indicator" id="swipeIndicator">Desliza para cambiar de pestaña</div>

  <div class="modal-overlay hidden" id="charModalOverlay">
    <div class="modal" id="charModal"></div>
  </div>
  <div class="modal-overlay hidden" id="diceModalOverlay">
    <div class="modal" id="diceModal"></div>
  </div>
  <div class="modal-overlay hidden" id="dataModalOverlay">
    <div class="modal" id="dataModal"></div>
  </div>
  <div class="modal-overlay hidden" id="pinModalOverlay">
    <div class="modal" id="pinModal"></div>
  </div>
  <div class="modal-overlay hidden" id="loreModalOverlay">
    <div class="modal" id="loreModal"></div>
  </div>
  <div class="modal-overlay hidden" id="conflictModalOverlay">
    <div class="modal" id="conflictModal"></div>
  </div>
  <div class="modal-overlay hidden" id="feedbackModalOverlay">
    <div class="modal feedback-modal-box" id="feedbackModal"></div>
  </div>
  <div class="roll-overlay hidden" id="rollOverlay" role="dialog" aria-modal="true" aria-labelledby="bg3RollTitle">
    <div class="bg3-chamber" id="bg3Chamber">
      <!-- Decoración gótica de esquina -->
      <div class="bg3-corner tl"></div>
      <div class="bg3-corner tr"></div>
      <div class="bg3-corner bl"></div>
      <div class="bg3-corner br"></div>

      <!-- Cabecera de tirada -->
      <div class="bg3-header">
        <button class="bg3-close-btn" data-action="close-bg3-roll" aria-label="Cerrar cámara de dados">✕</button>
        <div class="bg3-title" id="bg3RollTitle">Investigación</div>
        <div class="bg3-subtitle" id="bg3RollSubtitle">Prueba de Inteligencia (1d20)</div>
      </div>

      <!-- Placa de Clase de Dificultad (CD) -->
      <div class="bg3-dc-plate" id="bg3DcPlate">
        <div class="bg3-dc-filigree left"></div>
        <div class="bg3-dc-arch">
          <div class="bg3-dc-label" id="bg3DcLabel">CLASE DE DIFICULTAD</div>
          <div class="bg3-dc-row">
            <button class="bg3-dc-btn" data-action="bg3-dc-dec" title="Disminuir CD" aria-label="Disminuir CD">-</button>
            <div class="bg3-dc-number" id="bg3DcValue" title="Objetivo de dificultad">10</div>
            <button class="bg3-dc-btn" data-action="bg3-dc-inc" title="Aumentar CD" aria-label="Aumentar CD">+</button>
          </div>
          <div class="bg3-dc-mode-tag" id="bg3DcStatus">Objetivo activo</div>
        </div>
        <div class="bg3-dc-filigree right"></div>
      </div>

      <!-- Selector de modalidad: Normal / Ventaja / Desventaja -->
      <div class="bg3-mode-bar" id="bg3ModeSelector">
        <button class="bg3-mode-pill active" data-action="bg3-set-mode" data-mode="normal">⚔️ Normal</button>
        <button class="bg3-mode-pill" data-action="bg3-set-mode" data-mode="adv">🍀 Ventaja</button>
        <button class="bg3-mode-pill" data-action="bg3-set-mode" data-mode="disadv">💀 Desventaja</button>
      </div>

      <!-- Escenario y dado 3D -->
      <div class="bg3-sanctuary">
        <div class="bg3-astrolabe" aria-hidden="true">
          <div class="astrolabe-ring ring-outer"></div>
          <div class="astrolabe-ring ring-mid"></div>
          <div class="astrolabe-ring ring-inner"></div>
          <div class="astrolabe-glow"></div>
        </div>

        <!-- Escenario de Dados 3D (soporta 1 o 2 dados con ventaja/desventaja) -->
        <div class="bg3-dice-stage" id="bg3DiceStage" data-action="bg3-trigger-roll" role="button" tabindex="0" aria-label="Tirar dados">
          <div class="bg3-die-slot" id="bg3DieSlotPrimary"></div>
          <div class="bg3-die-slot hidden" id="bg3DieSlotSecondary"></div>
        </div>

        <!-- Banner interactivo de lanzamiento -->
        <div class="bg3-prompt-wrap">
          <button class="bg3-prompt-banner" id="bg3PromptBanner" data-action="bg3-trigger-roll">
            <span class="bg3-prompt-icon">✧</span>
            <span class="bg3-prompt-text" id="bg3PromptText">Haz clic en el dado para tirarlo</span>
            <span class="bg3-prompt-icon">✧</span>
          </button>
        </div>
      </div>

      <!-- Veredicto de Tirada (Éxito, Fallo, Crítico, Pifia) -->
      <div class="bg3-verdict-plate hidden" id="bg3VerdictBanner">
        <div class="bg3-verdict-title" id="bg3VerdictText">¡ÉXITO!</div>
        <div class="bg3-verdict-math" id="bg3VerdictBreakdown">[14] + [4] = 18</div>
      </div>

      <!-- Bonificadores -->
      <div class="bg3-shelf">
        <div class="bg3-mod-cards" id="bg3ModCards">
          <!-- Tarjetas de bonificador dinámicas -->
        </div>

        <!-- Divisor con Bonificador Total -->
        <div class="bg3-total-divider">
          <div class="bg3-divider-line"></div>
          <div class="bg3-total-badge">
            <span class="bg3-total-label">Bonificador total</span>
            <span class="bg3-total-num" id="bg3TotalModVal">+0</span>
          </div>
          <div class="bg3-divider-line"></div>
        </div>

        <!-- Barra inferior: Añadir bonificador / Acciones post-tirada -->
        <div class="bg3-actions-bar">
          <button class="bg3-btn-add-mod" id="bg3BtnAddMod" data-action="bg3-open-add-mod">
            <span class="bg3-cross-icon">✚</span> Añadir bonificador
          </button>
          <div class="bg3-post-actions hidden" id="bg3PostActions">
            <button class="bg3-btn-secondary" data-action="bg3-reroll">🎲 Volver a tirar</button>
            <button class="bg3-btn-primary" data-action="close-bg3-roll">✓ Aceptar</button>
          </div>
        </div>

        <!-- Popover para añadir bonificador rápido o personalizado -->
        <div class="bg3-popover hidden" id="bg3AddModPopover">
          <div class="bg3-popover-title">
            <span>Añadir Bonificador Circunstancial</span>
            <button class="bg3-popover-x" data-action="bg3-close-add-mod">✕</button>
          </div>
          <div class="bg3-quick-pills">
            <button class="bg3-qpill" data-action="bg3-quick-mod" data-val="1">+1</button>
            <button class="bg3-qpill" data-action="bg3-quick-mod" data-val="2">+2</button>
            <button class="bg3-qpill" data-action="bg3-quick-mod" data-val="3">+3</button>
            <button class="bg3-qpill" data-action="bg3-quick-mod" data-val="5">+5</button>
            <button class="bg3-qpill neg" data-action="bg3-quick-mod" data-val="-1">-1</button>
            <button class="bg3-qpill neg" data-action="bg3-quick-mod" data-val="-2">-2</button>
          </div>
          <div class="bg3-custom-mod-form">
            <input type="text" id="bg3CustomLabel" placeholder="Motivo (ej: Guía, Apoyo)" maxlength="25">
            <input type="number" id="bg3CustomVal" value="1" style="width:50px;text-align:center;">
            <button class="bg3-btn-submit-mod" data-action="bg3-submit-custom-mod">Añadir</button>
          </div>
        </div>
      </div>

      <!-- Compatibilidad con llamadas heredadas si las hubiera -->
      <div id="rollLabel" style="display:none;"></div>
      <div id="rollScore" style="display:none;"></div>
      <div id="rollVerdict" style="display:none;"></div>
      <div id="rollDetail" style="display:none;"></div>
      <div id="rollDieGraphic" style="display:none;"></div>
      <div id="rollAdvVisual" style="display:none;"></div>
      <div id="cupStage" style="display:none;"></div>
      <div id="rollResultStage" style="display:none;"></div>
    </div>
  </div>

  <input type="file" id="portraitFileInput" accept="image/*" hidden>
  <input type="file" id="mapFileInput" accept="image/*" hidden>
  <input type="file" id="bestiaryFileInput" accept="image/*" hidden>
  <input type="file" id="questFileInput" accept="image/*" hidden>
  <input type="file" id="questCardFileInput" accept="image/*" hidden>
  <input type="file" id="clueFileInput" accept="image/*" hidden>
  <input type="file" id="summonFileInput" accept="image/*" hidden>
  <input type="file" id="importFileInput" accept="application/json" hidden>

  <script src="js/maps.js?v=1.2.4"></script>
  <script src="js/markers.js?v=1.2.4"></script>
  <script src="js/quests.js?v=1.2.4"></script>
  <script src="js/dice.js?v=1.2.4"></script>
  <script src="js/ui-modals.js?v=1.2.4"></script>
  <script src="js/ui-render.js?v=1.2.4"></script>
  <script src="js/ui-events.js?v=1.2.4"></script>
  <script src="js/app.js?v=1.2.4"></script>
</body>
