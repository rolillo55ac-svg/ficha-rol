<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krysalis · Fichas de Rol</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#140E0B;
  --bg-elev:#1C1410;
  --bg-card:#241A14;
  --line:rgba(176,141,87,0.24);
  --line-strong:rgba(176,141,87,0.50);
  --ink:#F2E9DB;
  --ink-dim:#C0B095;
  --ink-faint:#8E7C64;
  --blood:#8C252F;
  --blood-light:#C84B57;
  --accent-rgb:140,37,47;
  --gold:#B08D57;
  --gold-light:#DEC392;
  --teal:#3D6E60;
  --teal-light:#76AC9D;
  --danger:#C0392B;
  --radius:10px;
  --radius-sm:6px;
  --font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Consolas,'Liberation Mono',monospace;
}
body[data-theme="purple"]{--blood:#5A2F82;--blood-light:#9B69D4;--accent-rgb:90,47,130;}
body[data-theme="blue"]{--blood:#284B76;--blood-light:#5B91C8;--accent-rgb:40,75,118;}
body[data-theme="pink"]{--blood:#88345C;--blood-light:#D47FA7;--accent-rgb:136,52,92;}
body[data-theme="green"]{--blood:#26461F;--blood-light:#6CA03C;--accent-rgb:38,70,31;}
*{box-sizing:border-box;}
html{font-size:17px;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(var(--accent-rgb),0.22), transparent 65%),
    radial-gradient(ellipse 700px 400px at 90% 110%, rgba(61,110,96,0.12), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background .4s ease;
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;color:var(--ink);}
::selection{background:var(--blood);color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-elev);}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) var(--bg-elev);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

#app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg, var(--bg-elev) 85%, rgba(28,20,16,0.96));
  border-bottom:1.5px solid var(--line-strong);
  padding:12px 16px 14px;
  backdrop-filter:blur(6px);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.char-switch{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--ink);padding:0;text-align:left;flex:1;min-width:0;}
.char-crest{
  width:46px;height:46px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%, var(--blood-light), var(--blood) 75%);
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:1.25rem;color:var(--ink);
  background-size:cover;background-position:center;
}
.char-name{font-family:var(--font-display);font-size:1.15rem;color:var(--gold-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.char-sub{font-size:.74rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}

.role-badge{
  font-size:.62rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;
  padding:3px 8px;border-radius:12px;border:1px solid var(--line);color:var(--ink-faint);background:var(--bg-card);
}
.role-badge.gm{border-color:var(--blood-light);color:var(--gold-light);background:rgba(140,37,47,0.3);}
.role-badge.player{border-color:var(--teal);color:var(--teal-light);}

.icon-btn{
  background:none;border:1px solid var(--line);color:var(--ink-dim);
  width:42px;height:42px;border-radius:50%;flex:none;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-light);}
.save-flag{font-size:.68rem;color:var(--teal-light);opacity:0;transition:opacity .3s;text-transform:uppercase;}
.save-flag.show{opacity:1;}

.gauges{display:flex;gap:12px;margin-top:10px;}
.gauge-wrap{flex:1;min-width:0;}
.gauge-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;}
.gauge-nums{font-family:var(--font-mono);color:var(--ink-dim);font-size:.74rem;}
.gauge{height:14px;border-radius:7px;background:var(--bg-card);border:1px solid var(--line-strong);overflow:hidden;}
.gauge-fill{height:100%;transition:width .3s ease;}
.gauge-fill.hp{background:linear-gradient(90deg,var(--blood),var(--blood-light));}
.gauge-fill.mana{background:linear-gradient(90deg,#2D4B60,#5E8EA8);}
.gauge-adjust{display:flex;gap:5px;margin-top:6px;}
.gauge-adjust button{
  flex:1;background:var(--bg-card);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:var(--radius-sm);padding:4px 0;font-size:.76rem;font-family:var(--font-mono);
}
.gauge-adjust button:hover{border-color:var(--gold);color:var(--gold-light);}

/* CONTENIDO PRINCIPAL */
main{flex:1;padding:16px 16px 100px;overflow-y:auto;}
.section{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.section-title{
  font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:.82rem;
  color:var(--gold-light);border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;
}
.section-title span{display:flex;align-items:center;gap:6px;}
.section-title span::before{content:'§';color:var(--blood-light);font-size:1.1rem;}

/* RETRATO Y CAMPOS */
.portrait-container{display:flex;gap:18px;align-items:center;margin-bottom:14px;}
.portrait-avatar{
  width:115px;height:115px;border-radius:12px;border:1.5px solid var(--gold);
  background:var(--bg-elev);background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:2.2rem;flex:none;
  box-shadow:0 4px 14px rgba(0,0,0,.45);
}
.portrait-ctrls{display:flex;flex-direction:column;gap:6px;}
.btn-compact{padding:6px 12px;font-size:.74rem;text-transform:uppercase;border-radius:4px;border:1px solid var(--line);background:none;color:var(--ink-dim);}
.btn-compact:hover{border-color:var(--gold);color:var(--gold-light);}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.field-grid.wide{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.field input, .field textarea, .field select{
  background:transparent;border:none;border-bottom:1px solid var(--line-strong);
  color:var(--ink);padding:5px 2px;font-size:.95rem;border-radius:0;width:100%;
}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-bottom-color:var(--teal-light);}
.field textarea{resize:vertical;min-height:55px;line-height:1.4;}

/* ATRIBUTOS Y LEVEL UP */
.attr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.attr-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 4px;text-align:center;}
.attr-card label{display:block;font-size:.65rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:5px;}
.attr-stepper{display:flex;align-items:center;justify-content:center;gap:2px;}
.attr-card input{width:40px;text-align:center;background:transparent;border:none;color:var(--gold-light);font-family:var(--font-mono);font-size:1.35rem;font-weight:700;}
.attr-step{
  background:var(--bg-card);border:1px solid var(--line);color:var(--gold-light);
  width:24px;height:24px;border-radius:4px;font-family:var(--font-mono);font-size:.95rem;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.attr-step:hover{border-color:var(--gold);background:rgba(176,141,87,0.15);}
.level-pool-banner{
  background:rgba(222,195,146,0.12);border:1px solid var(--gold);border-radius:var(--radius-sm);
  padding:10px 14px;margin-bottom:12px;font-size:.82rem;color:var(--gold-light);display:flex;justify-content:space-between;align-items:center;
}

/* TABLA DE HABILIDADES */
.attr-group{margin-bottom:16px;}
.attr-group-title{
  font-family:var(--font-mono);font-size:.76rem;color:var(--teal-light);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:4px;padding-left:2px;
}
.skill-col-headers{
  display:grid;grid-template-columns:1fr 38px 48px 46px 36px;gap:6px;
  font-size:.65rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;
  padding-bottom:5px;margin-bottom:2px;border-bottom:1px solid var(--line-strong);
}
.skill-col-headers span{text-align:center;}
.skill-col-headers span:first-child{text-align:left;}

.skill-row{
  display:grid;grid-template-columns:1fr 38px 48px 46px 36px;gap:6px;align-items:center;
  padding:7px 0;border-bottom:1px dashed var(--line);
}
.skill-row:last-child{border-bottom:none;}
.skill-name{font-size:.9rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.skill-hybrid-select{
  font-size:.65rem;background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-faint);
  border-radius:4px;padding:2px 3px;margin-top:1px;
}
.skill-base{font-family:var(--font-mono);font-size:.84rem;color:var(--ink-faint);text-align:center;}
.skill-bonus input{
  width:100%;background:var(--bg-elev);border:1px solid var(--line);border-radius:4px;
  text-align:center;font-family:var(--font-mono);font-size:.88rem;padding:4px 0;color:var(--ink);
}
.skill-total{font-family:var(--font-mono);font-weight:700;font-size:1rem;color:var(--gold-light);text-align:center;}
.dice-btn{
  background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink-faint);
  font-size:1.05rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
}
.dice-btn:hover{border-color:var(--blood-light);color:var(--blood-light);}

/* COMBATE Y BUFFS */
.buffs-container{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.buff-pill{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;font-size:.76rem;color:var(--ink-dim);cursor:pointer;user-select:none;transition:.15s;
  display:flex;align-items:center;gap:6px;
}
.buff-pill.active{border-color:var(--teal-light);color:var(--teal-light);background:rgba(61,110,96,0.3);}
.buff-pill.debuff.active{border-color:var(--danger);color:#E74C3C;background:rgba(192,57,43,0.3);}

.combat-quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.combat-quick-btn{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 10px;display:flex;flex-direction:column;gap:3px;align-items:center;
}
.combat-quick-btn:hover{border-color:var(--blood-light);}
.combat-quick-btn .cq-label{font-size:.74rem;color:var(--ink-dim);text-transform:uppercase;}
.combat-quick-btn .cq-total{font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--gold-light);}

.combat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.combat-stat{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 6px;text-align:center;position:relative;}
.combat-stat label{display:block;font-size:.62rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;}
.combat-stat input{width:100%;background:none;border:none;text-align:center;font-family:var(--font-mono);font-size:1.15rem;color:var(--ink);}
.combat-stat .mini-roll{position:absolute;top:3px;right:3px;background:none;border:none;color:var(--ink-faint);font-size:.9rem;padding:0;}
.combat-stat .mini-roll:hover{color:var(--blood-light);}

.pv-mana-block{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.pv-mana-block .stat-box{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;}
.pv-mana-block label{display:block;font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:4px;}
.pv-mana-inline{display:flex;align-items:center;gap:6px;}
.pv-mana-inline input{width:100%;background:none;border:none;text-align:center;font-family:var(--font-mono);font-size:1.05rem;color:var(--ink);border-bottom:1px solid var(--line-strong);padding:2px;}
.pv-mana-inline span{color:var(--ink-faint);font-family:var(--font-mono);}

/* FILAS DINÁMICAS */
.list-row{display:grid;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.list-row:last-child{border-bottom:none;}
.list-row input{background:var(--bg-elev);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:.9rem;}
.row-del{
  background:none;border:1px solid var(--line);color:var(--ink-faint);border-radius:6px;
  width:30px;height:30px;font-size:.95rem;flex:none;display:flex;align-items:center;justify-content:center;
}
.row-del:hover{border-color:var(--danger);color:var(--danger);}
.weapons-row{grid-template-columns:1fr 75px 55px 34px 30px;}
.armor-row{grid-template-columns:1fr 65px 65px 30px;}
.inv-row{grid-template-columns:1fr 55px 30px;}
.spell-row{grid-template-columns:1fr 60px 75px 30px;}
.stone-row{grid-template-columns:85px 1fr 30px;}
.text-row{grid-template-columns:1fr 30px;}
.pop-row{grid-template-columns:1fr 1fr 1fr 30px;}

.add-row-btn{
  width:100%;margin-top:10px;background:none;border:1px dashed var(--line-strong);
  color:var(--ink-dim);border-radius:var(--radius-sm);padding:9px 0;font-size:.8rem;
  text-transform:uppercase;letter-spacing:.05em;
}
.add-row-btn:hover{border-color:var(--gold);color:var(--gold-light);}

.money-row{display:flex;gap:14px;}
.money-field{flex:1;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;}
.money-field label{display:block;font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;}
.money-field input{width:100%;background:none;border:none;font-family:var(--font-mono);font-size:1.15rem;color:var(--gold-light);}

/* INVOCACIONES Y BESTIARIO */
.creature-card{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:12px;position:relative;
}
.creature-card .row-del{position:absolute;top:10px;right:10px;}
.creature-name-input{
  width:calc(100% - 45px);background:transparent;border:none;border-bottom:1px solid var(--line-strong);
  color:var(--gold-light);font-family:var(--font-display);font-size:1.05rem;padding:3px 2px;margin-bottom:10px;
}
.creature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px 10px;margin-bottom:10px;}
.creature-field{display:flex;flex-direction:column;gap:2px;}
.creature-field label{font-size:.62rem;color:var(--ink-faint);text-transform:uppercase;}
.creature-field input{background:var(--bg-card);border:1px solid var(--line);border-radius:4px;padding:5px 6px;font-size:.86rem;font-family:var(--font-mono);}
.creature-notes{
  width:100%;background:var(--bg-card);border:1px solid var(--line);border-radius:4px;
  padding:8px 10px;font-size:.84rem;font-family:var(--font-body);min-height:50px;resize:vertical;line-height:1.4;
}

/* LORE */
.lore-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;position:relative;}
.lore-card .row-del{position:absolute;top:8px;right:8px;}
.lore-title-input{width:calc(100% - 38px);background:transparent;border:none;border-bottom:1px solid var(--line-strong);color:var(--gold-light);font-family:var(--font-display);font-size:.95rem;padding:2px;margin-bottom:6px;}
.lore-text-area{width:100%;background:var(--bg-card);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:.84rem;min-height:45px;resize:vertical;}

/* MAPA */
.map-frame{
  width:100%;min-height:220px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);
  background:#090605;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:12px;
  overflow:hidden;
}
.map-frame img{width:100%;display:block;}
.map-frame.empty{color:var(--ink-faint);font-size:.85rem;font-style:italic;padding:40px 10px;text-align:center;}

/* DADOS MODAL */
.roll-overlay{position:fixed;inset:0;background:rgba(8,5,4,0.85);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;}
.roll-overlay.hidden{display:none;}
.roll-box{
  background:var(--bg-elev);border:1.5px solid var(--line-strong);border-radius:18px;
  padding:26px 22px;text-align:center;width:100%;max-width:300px;box-shadow:0 16px 50px rgba(0,0,0,0.7);
}
.roll-die-graphic{display:flex;align-items:center;justify-content:center;margin:12px 0;}
.roll-die-graphic svg{width:86px;height:86px;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.6));}
.roll-die-graphic.spinning svg{animation:dieSpin .55s cubic-bezier(.34,1.4,.64,1);}
@keyframes dieSpin{0%{transform:rotate(0deg) scale(.7);}100%{transform:rotate(720deg) scale(1);}}
.roll-score{font-family:var(--font-mono);font-size:2.9rem;font-weight:700;color:var(--gold-light);line-height:1;}
.roll-score.crit{color:var(--gold-light);text-shadow:0 0 18px rgba(217,188,133,.85);}
.roll-score.fumble{color:var(--danger);text-shadow:0 0 18px rgba(192,57,43,.85);}
.roll-verdict{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.roll-verdict.crit{color:var(--gold-light);}
.roll-verdict.fumble{color:var(--danger);}

/* HISTORIAL */
.roll-log{margin-top:8px;}
.roll-log-item{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-dim);}
.roll-log-item:last-child{border-bottom:none;}
.roll-log-item .rl-formula{color:var(--ink-faint);font-family:var(--font-mono);font-size:.72rem;}
.roll-log-item .rl-result{color:var(--gold-light);font-family:var(--font-mono);font-weight:700;}
.roll-empty{font-size:.78rem;color:var(--ink-faint);font-style:italic;}

/* TABBAR */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:960px;margin:0 auto;
  background:linear-gradient(0deg, var(--bg-elev) 85%, rgba(28,20,16,0.96));
  border-top:1.5px solid var(--line-strong);
  display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tab-btn{
  flex:1 0 auto;min-width:62px;background:none;border:none;color:var(--ink-faint);display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:6px 4px;font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;
}
.tab-btn.active{color:var(--gold-light);}
.tab-btn.active::after{content:'';width:20px;height:2px;background:var(--blood-light);border-radius:2px;}

.fab-dice{
  position:fixed;right:18px;bottom:78px;z-index:41;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--blood-light), var(--blood) 75%);
  border:1.5px solid var(--gold);color:var(--ink);font-size:1.6rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.55);
}

.modal-overlay{position:fixed;inset:0;background:rgba(8,5,4,0.78);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal-overlay.hidden{display:none;}
.modal{
  background:var(--bg-elev);border:1.5px solid var(--line-strong);border-radius:16px 16px 0 0;
  width:100%;max-width:540px;max-height:85vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:640px){.modal{border-radius:16px;}}

var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  return audioCtx;
}
function playDiceRollSound(){
  var ctx = getAudioCtx(); if(!ctx) return;
  var now = ctx.currentTime;
  for(var i=0;i<7;i++){
    var t = now + i*0.055 + Math.random()*0.02;
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(220 + Math.random()*340, t);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+0.06);
  }
}

  var ctx = getAudioCtx(); if(!ctx) return;
  var now = ctx.currentTime;

    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(f, now + idx*0.04);
    gain.gain.setValueAtTime(0.001, now + idx*0.04);
    gain.gain.exponentialRampToValueAtTime(0.24, now + idx*0.04 + 0.02);

    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now + idx*0.04); osc.stop(now + idx*0.04 + 0.6);
  });
}

function openRollModal(label, scoreText, detailHtml, sides, isCrit, isFumble){
  document.getElementById("rollLabel").textContent = label;
  var container = document.getElementById("rollDieGraphic");
  var reveal = document.getElementById("rollReveal");
  var scoreEl = document.getElementById("rollScore");
  var verdictEl = document.getElementById("rollVerdict");
  container.innerHTML = getDieSvg(sides);
  scoreEl.textContent = scoreText;
  scoreEl.className = "roll-score" + (isCrit?" crit":isFumble?" fumble":"");
  verdictEl.textContent = isCrit ? "¡CRÍTICO!" : (isFumble ? "¡PIFIA!" : "");
  verdictEl.className = "roll-verdict" + (isCrit?" crit":isFumble?" fumble":"");
  document.getElementById("rollDetail").innerHTML = detailHtml;
  reveal.style.opacity = "0";
  container.classList.remove("spinning");
  void container.offsetWidth;
  container.classList.add("spinning");
  document.getElementById("rollOverlay").classList.remove("hidden");
  playDiceRollSound();
  setTimeout(function(){
    container.classList.remove("spinning");
    reveal.style.opacity = "1";
    if(isCrit) playCritSound();
    else if(isFumble) playFumbleSound();
  }, 480);
}

function performD10Roll(charName, label, mod){
  var c = activeChar();
  var extraMod = 0;
  if(c.buffs){
    if(c.buffs.sangre_ataque_melee && label.includes("melé")) extraMod += 1;
    if(c.buffs.sangre_ataque_dist && label.includes("distancia")) extraMod += 1;
    if(c.buffs.mono) extraMod -= 1;
  }
  var d = rollDie(10);
  var total = d + num(mod,0) + extraMod;
  var detail = "1d10 ("+d+") + "+(num(mod,0)+extraMod);
  var isCrit = d===10, isFumble = d===1;
  state.rollLog.unshift({id:uid(), charName:charName, label:label, total:total, formulaText:detail, ts:Date.now()});
  if(state.rollLog.length>20) state.rollLog.length=20;
  saveState();
  openRollModal(label, total, "<div>"+esc(detail)+"</div>", 10, isCrit, isFumble);
  renderTab();
}

function performWeaponRoll(charName, weaponName, formulaRaw){
  var m = String(formulaRaw||"").match(/(\d+)\s*[dD]\s*(\d+)/);
  if(!m){ alert("Fórmula de daño no válida (ej: 1D6+3)"); return; }
  var qty = parseInt(m[1],10), sides = parseInt(m[2],10);
  var rest = String(formulaRaw).slice(m.index + m[0].length);
  var modM = rest.match(/^\s*([+-]\s*\d+)/);
  var mod = modM ? parseInt(modM[1].replace(/\s+/g,""),10) : 0;
  var rolls=[], sum=0;
  for(var i=0;i<qty;i++){ var r=rollDie(sides); rolls.push(r); sum+=r; }
  var isCrit = rolls.every(function(r){return r===sides;});
  var isFumble = rolls.every(function(r){return r===1;});
  var total = sum + mod;
  var detail = qty+"d"+sides+" ("+rolls.join("+")+")"+(mod?(mod>0?" + "+mod:" - "+Math.abs(mod)):"");
  openRollModal("Daño — "+weaponName, total, "<div>"+esc(detail)+"</div>", sides, isCrit, isFumble);
}

function tplHabilidades(c){
  var groups = {}; ATTRS.forEach(function(a){groups[a]=[];});
  var hybrids = [];
  SKILL_DEFS.forEach(function(s){ if(s.attr==="hybrid") hybrids.push(s); else groups[s.attr].push(s); });

  var html = '<div class="section"><div class="section-title"><span>Habilidades Generales</span></div>';
  ATTRS.forEach(function(a){
    html += '<div class="attr-group"><div class="attr-group-title">'+ATTR_LABELS[a]+'</div>';
    html += '<div class="skill-col-headers"><span>Habilidad</span><span>Base</span><span>Bono</span><span>Total</span><span></span></div>';
    groups[a].forEach(function(s){ html += skillRowHtml(s,c); });
    html += '</div>';
  });
  html += '<div class="attr-group"><div class="attr-group-title">Híbridas</div>';
  html += '<div class="skill-col-headers"><span>Habilidad</span><span>Base</span><span>Bono</span><span>Total</span><span></span></div>';
  hybrids.forEach(function(s){ html += skillRowHtml(s,c,true); });
  html += '</div>';

  if(c.customSkills && c.customSkills.length){
    html += '<div class="attr-group"><div class="attr-group-title">Personalizadas</div>';
    html += '<div class="skill-col-headers"><span>Habilidad</span><span>Base</span><span>Bono</span><span>Total</span><span></span></div>';
    c.customSkills.forEach(function(cs){
      html += '<div class="skill-row"><span>'+esc(cs.name)+' <small style="color:var(--ink-faint);">('+ATTR_LABELS[cs.attr].slice(0,3)+')</small></span><span class="skill-base">'+getEffectiveAttr(cs.attr,c)+'</span><span class="skill-bonus"><input type="number" data-bind="customSkills.'+cs.id+'.bonus" value="'+num(cs.bonus,0)+'"></span><span class="skill-total">'+customSkillTotal(cs,c)+'</span><button class="dice-btn" data-action="roll-custom-skill" data-id="'+cs.id+'">&#127922;</button></div>';
    });
    html += '</div>';
  }
  html += '<button class="add-row-btn" data-action="add-custom-skill">+ Añadir habilidad personalizada</button></div>';
  html += rollLogHtml();
  return html;
}

function skillRowHtml(s,c,isHybrid){

function setBind(target, path, rawValue, inputType){
  var parts = path.split(".");
  var value = inputType==="number" ? num(rawValue,0) : rawValue;
  if(parts.length===1){ target[parts[0]] = value; return; }
  if(parts[0]==="attrs"){ target.attrs[parts[1]] = value; return; }
  if(parts[0]==="combat"){ target.combat[parts[1]] = value; return; }
  if(parts[0]==="money"){ target.money[parts[1]] = value; return; }
  if(parts[0]==="skillBonus"){ target.skillBonus[parts[1]] = value; return; }
  if(parts[0]==="skillHybrid"){ target.skillHybrid[parts[1]] = value; return; }
  if(parts[0]==="customSkills"){
    var cs = target.customSkills.find(function(x){return x.id===parts[1];});
    if(cs) cs[parts[2]] = value;
    return;
  }
  var listFields = ["weapons","armors","inventory","spells","stones","passivesNeg","passivesPos","goddessCurses","goddessBlessings","goddessTable","customBuffs","summons","bestiary","poisons"];
  if(listFields.indexOf(parts[0])!==-1){
    var arr = target[parts[0]];
    var item = arr && arr.find(function(x){return x.id===parts[1];});
    if(item) item[parts[2]] = value;
    return;
  }
  if(parts[0]==="lore"){
    var loreArr = target.lore[parts[1]];
    var lItem = loreArr && loreArr.find(function(x){return x.id===parts[2];});
    if(lItem) lItem[parts[3]] = value;
    return;
  }
  target[path] = value;
}

function handleChange(e){
  var el = e.target.closest("[data-bind]"); if(!el) return;
  var isGlobal = el.getAttribute("data-scope")==="global";
  var target = isGlobal ? state : activeChar();
  setBind(target, el.getAttribute("data-bind"), el.value, el.type);
  saveState();
  renderTopbar();
  renderTab();
}

function handleClick(e){
  getAudioCtx();
  var btn = e.target.closest("[data-action]"); if(!btn) return;
  var action = btn.getAttribute("data-action");
  var c = activeChar();

  if(action==="filter-bestiary"){
    bestiaryContinentFilter = document.getElementById("bestiaryFilter").value;
    renderTab();
    return;
  }

  if(action==="gate-login"){
    var em = document.getElementById("gateEmail").value.trim();
    var pw = document.getElementById("gatePass").value;
    supabaseLogin(em, pw);
    return;
  }
  if(action==="gate-signup"){
    var em2 = document.getElementById("gateEmail").value.trim();
    var pw2 = document.getElementById("gatePass").value;
    supabaseSignup(em2, pw2);
    return;
  }

  if(action==="switch-tab"){ state.activeTab = btn.getAttribute("data-tab"); saveState(); renderTabbar(); renderTab(); return; }
  if(action==="hp-delta"){
    var d1 = parseInt(btn.getAttribute("data-delta"),10);
    c.combat.pvActual = clamp(num(c.combat.pvActual,0)+d1, 0, Math.max(0,num(c.combat.pvMax,0))||9999);
    saveState(); renderTopbar(); return;
  }
  if(action==="mana-delta"){
    var d2 = parseInt(btn.getAttribute("data-delta"),10);
    c.combat.manaActual = clamp(num(c.combat.manaActual,0)+d2, 0, Math.max(0,num(c.combat.manaMax,0))||9999);
    saveState(); renderTopbar(); return;
  }
  if(action==="attr-add"){
    var aId = btn.getAttribute("data-attr");
    if(num(c.attrPoints,0) > 0){ c.attrPoints--; }
    c.attrs[aId] = num(c.attrs[aId],0)+1;
    saveState(); renderTab(); return;
  }
  if(action==="attr-sub"){
    var aId2 = btn.getAttribute("data-attr");
    c.attrs[aId2] = Math.max(0, num(c.attrs[aId2],0)-1);
    saveState(); renderTab(); return;
  }
  if(action==="grant-level"){
    c.nivel = String(num(c.nivel,1)+1);
    c.attrPoints = num(c.attrPoints,0) + 4;
    saveState(); renderTopbar(); renderTab(); return;
  }
  if(action==="toggle-buff"){
    var bName = btn.getAttribute("data-buff");
    if(!c.buffs) c.buffs={};
    c.buffs[bName] = !c.buffs[bName];
    saveState(); renderTab(); return;
  }
  if(action==="roll-skill"){
    var sid = btn.getAttribute("data-id");
    var sdef = SKILL_DEFS.find(function(s){return s.id===sid;});
    performD10Roll(c.name, sdef.name, skillTotal(sdef,c));
    return;
  }
  if(action==="roll-custom-skill"){
    var csid = btn.getAttribute("data-id");
    var cs = (c.customSkills||[]).find(function(x){return x.id===csid;});
    if(cs) performD10Roll(c.name, cs.name, customSkillTotal(cs,c));
    return;
  }
  if(action==="add-custom-skill"){
    var nm = prompt("Nombre de la habilidad (ej: Pesca, Doma):");
    if(!nm) return;
    var attrChoice = prompt("Atributo base (fisico / destreza / inteligencia / percepcion / carisma):","destreza");
    if(ATTRS.indexOf(attrChoice)===-1) attrChoice="destreza";
    if(!c.customSkills) c.customSkills=[];
    c.customSkills.push({id:uid(),name:nm,attr:attrChoice,bonus:0});
    saveState(); renderTab(); return;
  }
  if(action==="add-custom-buff"){
    if(!c.customBuffs) c.customBuffs=[];
    c.customBuffs.push({id:uid(),name:""});
    saveState(); renderTab(); return;
  }
  if(action==="del-custom-buff"){
    c.customBuffs = (c.customBuffs||[]).filter(function(b){return b.id!==btn.getAttribute("data-id");});
    saveState(); renderTab(); return;
  }
  if(action==="roll-init"){ performD10Roll(c.name, "Iniciativa", c.combat.iniciativa); return; }
  if(action==="roll-weapon"){
    var wid = btn.getAttribute("data-id");
    var wpn = (c.weapons||[]).find(function(w){return w.id===wid;});
    if(wpn) performWeaponRoll(c.name, wpn.name||"Arma", wpn.dano);
    return;
  }
  if(action==="add-weapon"){ c.weapons.push({id:uid(),name:"",dano:"",alcance:""}); saveState(); renderTab(); return; }
  if(action==="del-weapon"){ c.weapons = c.weapons.filter(function(w){return w.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-armor"){ c.armors.push({id:uid(),name:"",absorcion:"",estorbo:""}); saveState(); renderTab(); return; }
  if(action==="del-armor"){ c.armors = c.armors.filter(function(a){return a.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-inventory"){ c.inventory.push({id:uid(),name:"",qty:1}); saveState(); renderTab(); return; }
  if(action==="del-inventory"){ c.inventory = c.inventory.filter(function(i){return i.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-spell"){ c.spells.push({id:uid(),name:"",coste:"",rango:""}); saveState(); renderTab(); return; }
  if(action==="del-spell"){ c.spells = c.spells.filter(function(s){return s.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-stone"){ c.stones.push({id:uid(),color:"",efecto:""}); saveState(); renderTab(); return; }
  if(action==="del-stone"){ c.stones = c.stones.filter(function(s){return s.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-summon"){ c.summons.push({id:uid(),name:"",vida:"",defensa:"",absorcion:"",dano:"",movilidad:"",inteligencia:"",notas:""}); saveState(); renderTab(); return; }
  if(action==="del-summon"){ c.summons = c.summons.filter(function(s){return s.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-poison"){ c.poisons.push({id:uid(),name:"",dosis:1,efectoEnemigo:"",efectoCherk:"",estado:"descubierto"}); saveState(); renderTab(); return; }
  if(action==="del-poison"){ c.poisons = c.poisons.filter(function(p){return p.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-passiveNeg"){ c.passivesNeg.push({id:uid(),text:""}); saveState(); renderTab(); return; }
  if(action==="del-passiveNeg"){ c.passivesNeg = c.passivesNeg.filter(function(p){return p.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }

  if(action==="del-blessing"){ c.goddessBlessings = c.goddessBlessings.filter(function(p){return p.id!==btn.getAttribute("data-id");}); saveState(); renderTab(); return; }
  if(action==="add-goddess"){ c.goddessTable.push({id:uid(),nombre:"",gustos:"",disgustos:""}); saveState(); renderTab(); return; }

      '<button class="btn btn-ghost" data-action="save-supabase-config" style="margin-top:8px;">Guardar Conexión</button>'+
    '</div>';

    html += '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">'+
      '<div class="section-title"><span>Sesión de Usuario</span></div>';
    if(currentUser){
      html += '<div style="font-size:0.85rem;color:var(--ink-dim);margin-bottom:8px;">Conectado: <b>'+esc(currentUser.email)+'</b> ('+currentRole.toUpperCase()+')</div>'+
        '<button class="btn btn-ghost" data-action="auth-logout">Cerrar Sesión</button>';
    } else {
      html += '<div class="field"><label>Email</label><input type="email" id="authEmail"></div>'+
        '<div class="field" style="margin-top:6px;"><label>Contraseña</label><input type="password" id="authPass"></div>'+
        '<div class="btn-row" style="margin-top:8px;">'+
          '<button class="btn btn-primary" data-action="auth-login">Entrar</button>'+
          '<button class="btn btn-ghost" data-action="auth-signup">Registrarse</button>'+
        '</div>';
    }
    html += '</div>';

    html += '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">'+
      '<div class="btn-row">'+
        '<button class="btn btn-ghost" data-action="export-data">Exportar JSON</button>'+
        '<button class="btn btn-ghost" data-action="import-data">Importar JSON</button>'+
      '</div>'+
    '</div>';
  }
  return html;
}

function modalClick(e){
  var btn = e.target.closest("[data-action]"); if(!btn) return;
  var action = btn.getAttribute("data-action");
  if(action==="close-modal"){ closeModals(); return; }
  if(action==="pick-char"){ state.activeId = btn.getAttribute("data-id"); saveState(); closeModals(); renderTopbar(); renderTab(); return; }
  if(action==="add-char"){
    var nName = prompt("Nombre del personaje:","Nuevo");
    if(nName){
      var nc = blankCharacter(nName);
      state.characters.push(nc); state.activeId = nc.id; saveState(); closeModals(); renderTopbar(); renderTab();
    }
    return;
  }
  if(action==="del-char"){
    if(confirm("¿Eliminar este personaje?")){
      state.characters = state.characters.filter(function(x){return x.id!==btn.getAttribute("data-id");});
      state.activeId = state.characters[0]?state.characters[0].id:"";
      saveState(); closeModals(); renderTopbar(); renderTab();
    }
    return;
  }
  if(action==="set-theme"){
    var thC = state.characters.find(function(x){return x.id===btn.getAttribute("data-id");});
    thC.theme = btn.getAttribute("data-theme"); saveState(); renderTopbar(); renderTab(); return;
  }
  if(action==="save-supabase-config"){
    localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({url:document.getElementById("cfgSupabaseUrl").value.trim(), key:document.getElementById("cfgSupabaseKey").value.trim()}));
    initSupabase(); closeModals(); return;
  }
  if(action==="auth-login"){ supabaseLogin(document.getElementById("authEmail").value.trim(), document.getElementById("authPass").value); return; }
  if(action==="auth-signup"){ supabaseSignup(document.getElementById("authEmail").value.trim(), document.getElementById("authPass").value); return; }
  if(action==="auth-logout"){ supabaseLogout(); return; }
  if(action==="export-data"){ exportData(); return; }
  if(action==="import-data"){ document.getElementById("importFileInput").click(); return; }
}

var diceState = {qty:1, sides:10, mod:0, mode:"normal"};
function diceModalHtml(){
  var sidesOpts=[4,6,8,10,12,20,100];
  return '<h2>Tirador de Dados<button data-action="close-modal">&times;</button></h2>'+
    '<div class="field"><label>Modalidad</label><select id="diceMode">'+
      '<option value="normal" '+(diceState.mode==='normal'?'selected':'')+'>Tirada Normal</option>'+
      '<option value="adv" '+(diceState.mode==='adv'?'selected':'')+'>Ventaja (2 dados, elige mayor)</option>'+
      '<option value="disadv" '+(diceState.mode==='disadv'?'selected':'')+'>Desventaja (2 dados, elige menor)</option>'+
    '</select></div>'+
    (diceState.sides===100?'':'<div class="field" style="margin-top:6px;"><label>Cantidad de dados</label><input type="number" min="1" id="diceQty" value="'+diceState.qty+'"></div>')+
    '<div class="dtype-row">'+sidesOpts.map(function(s){return '<button class="dtype-btn '+(diceState.sides===s?'active':'')+'" data-action="pick-die" data-sides="'+s+'">'+(s===100?'d%':'d'+s)+'</button>';}).join('')+'</div>'+
    '<div class="field" style="margin-top:6px;"><label>Modificador numérico</label><input type="number" id="diceMod" value="'+diceState.mod+'"></div>'+
    '<button class="btn btn-primary" data-action="roll-free">Lanzar Dados</button>';
}
function openDiceModal(){
  document.getElementById("diceModal").innerHTML = diceModalHtml();
  document.getElementById("diceModalOverlay").classList.remove("hidden");
}
function diceModalClick(e){
  var btn = e.target.closest("[data-action]"); if(!btn) return;
  var action = btn.getAttribute("data-action");
  if(action==="close-modal"){ closeModals(); return; }
  if(action==="pick-die"){ diceState.sides = parseInt(btn.getAttribute("data-sides"),10); openDiceModal(); return; }
  if(action==="roll-free"){
    diceState.mod = parseInt(document.getElementById("diceMod").value,10)||0;
    diceState.mode = document.getElementById("diceMode").value;

    if(diceState.sides===100){
      var t = (rollDie(10)-1)*10, u = rollDie(10)-1;
      var pct = t+u === 0 ? 100 : t+u;
      var tot = pct + diceState.mod;
      openRollModal("d% (Percentil)", tot, "<div>Decenas "+t+" + Unidades "+u+"</div>", 100, pct===100, pct===1);
      closeModals(); return;
    }

    if(diceState.mode==="adv" || diceState.mode==="disadv"){
      var r1 = rollDie(diceState.sides), r2 = rollDie(diceState.sides);
      var chosen = diceState.mode==="adv" ? Math.max(r1, r2) : Math.min(r1, r2);
      var totAdv = chosen + diceState.mod;
      var lblAdv = "d"+diceState.sides + (diceState.mode==="adv"?" (Ventaja)":" (Desventaja)");
      var detAdv = "Tiradas: ["+r1+", "+r2+"] → Elegido: "+chosen+(diceState.mod?(diceState.mod>0?" + "+diceState.mod:" - "+Math.abs(diceState.mod)):"");
      openRollModal(lblAdv, totAdv, "<div>"+detAdv+"</div>", diceState.sides, chosen===diceState.sides, chosen===1);
      closeModals(); return;
    }

    diceState.qty = Math.max(1, parseInt(document.getElementById("diceQty").value,10)||1);
    var rolls=[], sum=0;
    for(var i=0;i<diceState.qty;i++){ var r=rollDie(diceState.sides); rolls.push(r); sum+=r; }
    var isCrit = rolls.every(function(r){return r===diceState.sides;});
    var isFumble = rolls.every(function(r){return r===1;});
    var total = sum + diceState.mod;
    openRollModal(diceState.qty+"d"+diceState.sides, total, "<div>("+rolls.join("+")+")"+(diceState.mod?(diceState.mod>0?" + "+diceState.mod:" - "+Math.abs(diceState.mod)):"")+"</div>", diceState.sides, isCrit, isFumble);
    closeModals(); return;
  }
}

function exportData(){
  var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "krysalis-backup.json"; a.click();
}
function importData(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      state = migrateState(JSON.parse(r.result));
      state.activeId = state.characters[0]?state.characters[0].id:"";
      saveState(); closeModals(); renderTopbar(); renderTabbar(); renderTab();
    }catch(e){ alert("Archivo no válido."); }
  };
  r.readAsText(file);
}

function resizeImageFile(file, maxDim, quality, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxDim/Math.max(img.width,img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL("image/jpeg", quality||0.85));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* SUPABASE SINCRO */
function getSupabaseConfig(){
  try{
    var cfg = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY)) || {};
    return { url: cfg.url || DEFAULT_SUPABASE_URL, key: cfg.key || DEFAULT_SUPABASE_KEY };
  }catch(e){ return {url:DEFAULT_SUPABASE_URL, key:DEFAULT_SUPABASE_KEY}; }
}
function initSupabase(){
  var cfg = getSupabaseConfig();
  if(!cfg.url || !cfg.key || !window.supabase) {
    renderTab();
    return;
  }
  try{
    supabaseClient = window.supabase.createClient(cfg.url, cfg.key);
    supabaseClient.auth.getSession().then(function(res){
      if(res.data && res.data.session){ currentUser = res.data.session.user; fetchUserProfile(); }
      else { renderTab(); }
    }).catch(function(){ renderTab(); });
    supabaseClient.auth.onAuthStateChange(function(e, session){
      currentUser = session ? session.user : null;
      if(currentUser) fetchUserProfile(); else { currentRole='player'; renderTopbar(); renderTab(); }
    });
  }catch(e){ renderTab(); }
}
async function fetchUserProfile(){
  if(!supabaseClient || !currentUser) return;
  try{
    var res = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
    if(res.data && res.data.role) currentRole = res.data.role;
    pullAllFromSupabase();
    supabaseClient.channel('realtime_all').on('postgres_changes', {event:'*', schema:'public', table:'characters'}, function(){
      pullAllFromSupabase();
    }).subscribe();
  }catch(e){}
  renderTopbar();
}
async function supabaseLogin(em, pw){
  var res = await supabaseClient.auth.signInWithPassword({email:em, password:pw});
  if(res.error) alert(res.error.message); else closeModals();
}
async function supabaseSignup(em, pw){
  var res = await supabaseClient.auth.signUp({email:em, password:pw});
  if(res.error) alert(res.error.message); else alert("Registro completado. Ya puedes entrar.");
}
async function supabaseLogout(){
  await supabaseClient.auth.signOut(); currentUser=null; currentRole='player'; closeModals(); renderTopbar(); renderTab();
}
async function pullAllFromSupabase(){
  if(!supabaseClient || !currentUser) return;
  isRemoteSyncing = true;
  try{
    var charRes = await supabaseClient.from('characters').select('*');
    if(charRes.data && charRes.data.length){
      state.characters = charRes.data.map(function(r){ var c = r.data; c.db_id = r.id; return c; });
      if(!state.activeId && state.characters.length) state.activeId = state.characters[0].id;
    }
    saveState(true); renderTopbar(); renderTabbar(); renderTab();
  }catch(e){}
  isRemoteSyncing = false;
}
function pushCurrentCharToSupabase(){
  if(!supabaseClient || !currentUser) return;
  var c = activeChar(); if(!c || !c.name || c.id==="empty") return;
  var payload = {name:c.name, data:c, owner_id:currentUser.id, updated_at:new Date().toISOString()};
  if(c.db_id) payload.id = c.db_id;
  supabaseClient.from('characters').upsert(payload).then(function(res){
    if(res.data && res.data[0]) c.db_id = res.data[0].id;
  });
}

function init(){
  state = loadState();
  renderTopbar();
  renderTabbar();
  renderTab();

  document.getElementById("main").addEventListener("click", handleClick);
  document.getElementById("main").addEventListener("change", handleChange);
  document.getElementById("main").addEventListener("input", function(e){
    var el = e.target.closest("[data-bind]"); if(!el) return;
    var isGlobal = el.getAttribute("data-scope")==="global";
    var target = isGlobal ? state : activeChar();
    setBind(target, el.getAttribute("data-bind"), el.value, el.type);
    saveState();
  });
  document.getElementById("topbar").addEventListener("click", handleClick);
  document.getElementById("tabbar").addEventListener("click", handleClick);
  document.getElementById("charModal").addEventListener("click", modalClick);
  document.getElementById("dataModal").addEventListener("click", modalClick);
  document.getElementById("diceModal").addEventListener("click", diceModalClick);
  document.getElementById("charModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeModals(); });
  document.getElementById("dataModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeModals(); });
  document.getElementById("diceModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeModals(); });
  document.getElementById("rollOverlay").addEventListener("click", function(e){ if(e.target===this||e.target.closest("[data-action='close-modal']")) closeModals(); });

  document.getElementById("fabDice").addEventListener("click", openDiceModal);
  document.getElementById("portraitFileInput").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]){
      resizeImageFile(e.target.files[0], 400, 0.85, function(url){ activeChar().portrait = url; saveState(); renderTopbar(); renderTab(); });
    }
    e.target.value="";
  });
  document.getElementById("mapFileInput").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]){
      resizeImageFile(e.target.files[0], 1600, 0.85, function(url){ state.mapImage = url; saveState(); renderTab(); });
    }
    e.target.value="";
  });
  document.getElementById("importFileInput").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]) importData(e.target.files[0]);
    e.target.value="";
  });

  initSupabase();
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
