<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krysalis · Fichas de Rol v1.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#110C09;
  --bg-elev:#18110D;
  --bg-card:#221812;
  --line:rgba(176,141,87,0.25);
  --line-strong:rgba(176,141,87,0.52);
  --ink:#F3EADB;
  --ink-dim:#C2B196;
  --ink-faint:#8F7D65;
  --blood:#8C252F;
  --blood-light:#C84B57;
  --accent-rgb:140,37,47;
  --gold:#B08D57;
  --gold-light:#DEC392;
  --teal:#3D6E60;
  --teal-light:#76AC9D;
  --shield:#2E6F7E;
  --shield-light:#5FA3B3;
  --danger:#C0392B;
  --radius:10px;
  --radius-sm:6px;
  --font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Consolas,'Liberation Mono',monospace;
}
body[data-theme="purple"]{--blood:#5A2F82;--blood-light:#9B69D4;--accent-rgb:90,47,130;}
body[data-theme="blue"]{--blood:#284B76;--blood-light:#5B91C8;--accent-rgb:40,75,118;}
body[data-theme="pink"]{--blood:#88345C;--blood-light:#D47FA7;--accent-rgb:136,52,92;}
body[data-theme="green"]{--blood:#26461F;--blood-light:#6CA03C;--accent-rgb:38,70,31;}

*{box-sizing:border-box;}
html{font-size:16px;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}

/* RESET OSCURO GLOBAL OBLIGATORIO PARA EVITAR INPUTS BLANCOS */
input, textarea, select, button {
  font-family:inherit;
  color:var(--ink);
  background-color:transparent;
  border:1px solid var(--line);
  outline:none;
}
input:focus, textarea:focus, select:focus {
  border-color:var(--teal-light);
}
select option {
  background-color:var(--bg-elev);
  color:var(--ink);
}

body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(var(--accent-rgb),0.22), transparent 65%),
    radial-gradient(ellipse 700px 400px at 90% 110%, rgba(61,110,96,0.12), transparent 60%),
    var(--bg);
  min-height:100vh;
  transition:background .4s ease;
}
::selection{background:var(--blood);color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-elev);}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) var(--bg-elev);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

#app{max-width:1080px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg, var(--bg-elev) 88%, rgba(24,17,13,0.96));
  border-bottom:1.5px solid var(--line-strong);
  padding:10px 16px 12px;
  backdrop-filter:blur(6px);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.char-switch{display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;text-align:left;flex:1;min-width:0;cursor:pointer;}
.char-crest{
  width:46px;height:46px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%, var(--blood-light), var(--blood) 75%);
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:1.25rem;color:var(--ink);
  background-size:cover;background-position:center;
}
.char-name{font-family:var(--font-display);font-size:1.15rem;color:var(--gold-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.char-sub{font-size:.74rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}

.role-badge{
  font-size:.62rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;
  padding:3px 8px;border-radius:12px;border:1px solid var(--line);color:var(--ink-faint);background:var(--bg-card);
}
.role-badge.gm{border-color:var(--blood-light);color:var(--gold-light);background:rgba(140,37,47,0.3);}
.role-badge.player{border-color:var(--teal);color:var(--teal-light);}

.sync-status{
  font-size:.62rem;font-family:var(--font-mono);padding:2px 6px;border-radius:8px;
  border:1px solid var(--line);color:var(--ink-faint);white-space:nowrap;
}
.sync-status.synced{color:var(--teal-light);border-color:var(--teal);}
.sync-status.saving{color:var(--gold-light);border-color:var(--gold);}
.version-tag{font-size:.56rem;font-family:var(--font-mono);color:var(--ink-faint);margin-left:4px;}

.icon-btn{
  background:none;border:1px solid var(--line);color:var(--ink-dim);
  width:38px;height:38px;border-radius:50%;flex:none;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;transition:.15s;cursor:pointer;
}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-light);}

/* MEDIDORES DE ESTADO */
.gauges{display:grid;grid-template-columns:1fr 110px 1fr;gap:10px;margin-top:8px;}
@media(max-width:640px){.gauges{grid-template-columns:1fr 1fr;}}
.gauge-wrap{min-width:0;}
.gauge-label{display:flex;justify-content:space-between;font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:2px;}
.gauge-nums{font-family:var(--font-mono);color:var(--ink-dim);font-size:.72rem;}
.gauge{height:12px;border-radius:6px;background:var(--bg-card);border:1px solid var(--line-strong);overflow:hidden;}
.gauge-fill{height:100%;transition:width .3s ease;}
.gauge-fill.hp{background:linear-gradient(90deg,var(--blood),var(--blood-light));}
.gauge-fill.shield{background:linear-gradient(90deg,var(--shield),var(--shield-light));}
.gauge-fill.mana{background:linear-gradient(90deg,#2D4B60,#5E8EA8);}
.gauge-adjust{display:flex;gap:3px;margin-top:4px;}
.gauge-adjust button{
  flex:1;background:var(--bg-card);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:var(--radius-sm);padding:3px 0;font-size:.72rem;font-family:var(--font-mono);cursor:pointer;
}
.gauge-adjust button:hover{border-color:var(--gold);color:var(--gold-light);}

/* CONTENIDO PRINCIPAL */
main{flex:1;padding:16px 16px 140px;overflow-y:auto;}
.section{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.section-title{
  font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:.84rem;
  color:var(--gold-light);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;
}
.section-title span{display:flex;align-items:center;gap:6px;}
.section-title span::before{content:'§';color:var(--blood-light);font-size:1.1rem;}

/* HERO FICHA ESPACIOSA */
.ficha-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;}
@media(max-width:760px){.ficha-layout{grid-template-columns:1fr;}}

.portrait-box{display:flex;flex-direction:column;align-items:center;gap:8px;}
.portrait-img{
  width:100%;max-width:200px;aspect-ratio:1/1;border-radius:12px;border:1.5px solid var(--gold);
  background:var(--bg-elev);background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--ink-faint);
  box-shadow:0 6px 16px rgba(0,0,0,0.5);
}
.portrait-actions{display:flex;gap:6px;}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.field input, .field textarea, .field select{
  background:transparent;border:none;border-bottom:1px solid var(--line-strong);
  color:var(--ink);padding:4px 2px;font-size:.92rem;border-radius:0;width:100%;
}
.field textarea{resize:vertical;min-height:60px;line-height:1.4;}

/* ATRIBUTOS BASE */
.attr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.attr-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 4px;text-align:center;}
.attr-card label{display:block;font-size:.62rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;}
.attr-val-box{font-family:var(--font-mono);font-size:1.35rem;font-weight:700;color:var(--gold-light);}

.skill-pool-banner{
  background:rgba(222,195,146,0.14);border:1.5px solid var(--gold);border-radius:var(--radius-sm);
  padding:10px 14px;margin-bottom:12px;font-size:.82rem;color:var(--gold-light);display:flex;justify-content:space-between;align-items:center;
}

/* HABILIDADES */
.attr-group{margin-bottom:16px;}
.attr-group-title{
  font-family:var(--font-mono);font-size:.76rem;color:var(--teal-light);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:4px;padding-left:2px;
}
.skill-col-headers{
  display:grid;grid-template-columns:1fr 36px 64px 46px 36px;gap:6px;
  font-size:.64rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;
  padding-bottom:5px;margin-bottom:2px;border-bottom:1px solid var(--line-strong);
}
.skill-col-headers span{text-align:center;}
.skill-col-headers span:first-child{text-align:left;}

.skill-row{
  display:grid;grid-template-columns:1fr 36px 64px 46px 36px;gap:6px;align-items:center;
  padding:7px 0;border-bottom:1px dashed var(--line);
}
.skill-row:last-child{border-bottom:none;}
.skill-name{font-size:.88rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.skill-hybrid-select{
  font-size:.62rem;background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-faint);
  border-radius:4px;padding:1px 3px;margin-top:1px;
}
.skill-base{font-family:var(--font-mono);font-size:.84rem;color:var(--ink-faint);text-align:center;}
.skill-bonus-ctrl{display:flex;align-items:center;justify-content:center;gap:3px;}
.skill-bonus-ctrl span{font-family:var(--font-mono);font-size:.9rem;min-width:18px;text-align:center;}
.skill-bonus-ctrl button{
  width:20px;height:20px;background:var(--bg-elev);border:1px solid var(--line);border-radius:4px;
  font-size:.75rem;color:var(--gold-light);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.skill-bonus-ctrl button:hover{border-color:var(--gold);}
.skill-total{font-family:var(--font-mono);font-weight:700;font-size:1rem;color:var(--gold-light);text-align:center;}
.dice-btn{
  background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink-faint);
  font-size:1.05rem;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.dice-btn:hover{border-color:var(--blood-light);color:var(--blood-light);}

/* COMBATE */
.buffs-container{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.buff-pill{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;font-size:.76rem;color:var(--ink-dim);cursor:pointer;user-select:none;transition:.15s;
  display:flex;align-items:center;gap:6px;
}
.buff-pill.active{border-color:var(--teal-light);color:var(--teal-light);background:rgba(61,110,96,0.3);}
.buff-pill.debuff.active{border-color:var(--danger);color:#E74C3C;background:rgba(192,57,43,0.3);}

.combat-quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.combat-quick-btn{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 10px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;
}
.combat-quick-btn:hover{border-color:var(--blood-light);}
.combat-quick-btn .cq-label{font-size:.74rem;color:var(--ink-dim);text-transform:uppercase;}
.combat-quick-btn .cq-total{font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--gold-light);}

.combat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.combat-stat{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;position:relative;}
.combat-stat label{display:block;font-size:.62rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;}
.combat-stat input{width:100%;background:none;border:none;text-align:center;font-family:var(--font-mono);font-size:1.15rem;color:var(--ink);}
.combat-stat .mini-roll{position:absolute;top:3px;right:3px;background:none;border:none;color:var(--ink-faint);font-size:.85rem;cursor:pointer;}

/* FILAS DINÁMICAS */
.list-row{display:grid;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.list-row:last-child{border-bottom:none;}
.list-row input{background:var(--bg-elev);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:.88rem;}
.row-del{
  background:none;border:1px solid var(--line);color:var(--ink-faint);border-radius:6px;
  width:28px;height:28px;font-size:.9rem;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.row-del:hover{border-color:var(--danger);color:var(--danger);}
.weapons-row{grid-template-columns:1fr 75px 55px 32px 28px;}
.armor-row{grid-template-columns:1fr 65px 65px 28px;}
.inv-row{grid-template-columns:1fr 55px 28px;}
.spell-row{grid-template-columns:1fr 60px 75px 28px;}
.stone-row{grid-template-columns:85px 1fr 28px;}
.text-row{grid-template-columns:1fr 28px;}
.pop-row{grid-template-columns:1fr 1fr 1fr 28px;}

.add-row-btn{
  width:100%;margin-top:10px;background:none;border:1px dashed var(--line-strong);
  color:var(--ink-dim);border-radius:var(--radius-sm);padding:9px 0;font-size:.78rem;
  text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
}
.add-row-btn:hover{border-color:var(--gold);color:var(--gold-light);}

.money-row{display:flex;gap:14px;}
.money-field{flex:1;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;}
.money-field label{display:block;font-size:.64rem;color:var(--ink-faint);text-transform:uppercase;margin-bottom:2px;}
.money-field input{width:100%;background:none;border:none;font-family:var(--font-mono);font-size:1.15rem;color:var(--gold-light);}

/* INVOCACIONES Y ALQUIMIA */
.creature-card{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:12px;position:relative;
}
.creature-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.creature-name-input{
  flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid var(--line-strong);
  color:var(--gold-light);font-family:var(--font-display);font-size:1.05rem;padding:3px 2px;
}
.creature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px 10px;margin-bottom:10px;}
.creature-field{display:flex;flex-direction:column;gap:2px;}
.creature-field label{font-size:.62rem;color:var(--ink-faint);text-transform:uppercase;}
.creature-field input{background:var(--bg-card);border:1px solid var(--line);border-radius:4px;padding:5px 6px;font-size:.84rem;font-family:var(--font-mono);}
.creature-notes{
  width:100%;background:var(--bg-card);border:1px solid var(--line);border-radius:4px;
  padding:8px 10px;font-size:.84rem;font-family:var(--font-body);min-height:50px;resize:vertical;line-height:1.4;
}

/* LORE & HERBORISTERÍA CARDS */
.item-card{
  background:var(--bg-elev);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;
  border-left:4px solid var(--line);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
}
.item-card.rarity-comun{border-left-color:#A89F91;}
.item-card.rarity-rara{border-left-color:#60A5FA;}
.item-card.rarity-muyrara{border-left-color:#C084FC;}
.item-card.rarity-legendaria{border-left-color:#FDE047;}

.item-badge{
  font-size:.6rem;font-family:var(--font-mono);font-weight:700;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;letter-spacing:.04em;
}
.badge-comun{background:rgba(168,159,145,0.15);color:#C2B196;border:1px solid rgba(168,159,145,0.4);}
.badge-rara{background:rgba(96,165,250,0.15);color:#93C5FD;border:1px solid rgba(96,165,250,0.4);}
.badge-muyrara{background:rgba(192,132,252,0.15);color:#D8B4FE;border:1px solid rgba(192,132,252,0.4);}
.badge-legendaria{background:rgba(253,224,71,0.15);color:#FEF08A;border:1px solid rgba(253,224,71,0.4);}

.filter-section{margin-bottom:12px;}
.filter-label{font-size:.64rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.filter-pills{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.filter-pills::-webkit-scrollbar{display:none;}
.f-pill{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;
  padding:4px 10px;font-size:.72rem;color:var(--ink-dim);white-space:nowrap;cursor:pointer;flex:none;
}
.f-pill.active{border-color:var(--gold);color:var(--gold-light);background:rgba(176,141,87,0.18);}

/* MAPA */
.map-viewer{position:relative;width:100%;min-height:280px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);overflow:hidden;background:#090605;cursor:crosshair;}
.map-viewer img{width:100%;display:block;user-select:none;}
.map-pin{position:absolute;transform:translate(-50%,-100%);text-align:center;cursor:pointer;z-index:2;}
.pin-glyph{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin:0 auto 2px;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.6);}
.pin-tag{font-size:.65rem;background:rgba(15,10,8,0.92);color:var(--gold-light);padding:2px 6px;border-radius:3px;border:1px solid var(--line);white-space:nowrap;}
.pin-capital .pin-glyph{background:var(--gold);}
.pin-ciudad .pin-glyph{background:var(--blood);}
.pin-poi .pin-glyph{background:var(--teal);}
.pin-peligro .pin-glyph{background:var(--danger);}

/* MODAL DE DADOS */
.roll-overlay{position:fixed;inset:0;background:rgba(8,5,4,0.85);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;}
.roll-overlay.hidden{display:none;}
.roll-box{
  background:var(--bg-elev);border:1.5px solid var(--line-strong);border-radius:18px;
  padding:24px 20px;text-align:center;width:100%;max-width:320px;box-shadow:0 16px 50px rgba(0,0,0,0.7);
}
.roll-die-graphic{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0;}
.roll-die-graphic svg{width:76px;height:76px;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.6));}
.roll-die-graphic.spinning svg{animation:dieSpin .55s cubic-bezier(.34,1.4,.64,1);}
@keyframes dieSpin{0%{transform:rotate(0deg) scale(.7);}100%{transform:rotate(720deg) scale(1);}}
.roll-score{font-family:var(--font-mono);font-size:2.8rem;font-weight:700;color:var(--gold-light);line-height:1;}
.roll-score.crit{color:var(--gold-light);text-shadow:0 0 18px rgba(217,188,133,.85);}
.roll-score.fumble{color:var(--danger);text-shadow:0 0 18px rgba(192,57,43,.85);}
.roll-verdict{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
.roll-verdict.crit{color:var(--gold-light);}
.roll-verdict.fumble{color:var(--danger);}

.adv-dice-wrap{display:flex;justify-content:center;gap:10px;margin:6px 0;}
.adv-die-card{
  background:var(--bg-card);border:1.5px solid var(--line);border-radius:8px;
  padding:6px 12px;font-family:var(--font-mono);font-size:1.3rem;color:var(--ink-dim);
}
.adv-die-card.chosen{border-color:var(--gold);color:var(--gold-light);background:rgba(176,141,87,0.2);box-shadow:0 0 10px rgba(176,141,87,0.3);}
.adv-die-card.discarded{opacity:0.35;text-decoration:line-through;border-color:var(--danger);}

/* HISTORIAL */
.roll-log{margin-top:8px;}
.roll-log-item{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--ink-dim);}

/* TABBAR */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:1080px;margin:0 auto;
  background:linear-gradient(0deg, var(--bg-elev) 88%, rgba(24,17,13,0.96));
  border-top:1.5px solid var(--line-strong);
  display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tab-btn{
  flex:1 0 auto;min-width:60px;background:none;border:none;color:var(--ink-faint);display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:5px 3px;font-size:.65rem;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;
}
.tab-btn.active{color:var(--gold-light);}
.tab-btn.active::after{content:'';width:18px;height:2px;background:var(--blood-light);border-radius:2px;}

.fab-dice{
  position:fixed;right:16px;bottom:78px;z-index:41;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--blood-light), var(--blood) 75%);

  box-shadow:0 6px 18px rgba(0,0,0,0.55);cursor:pointer;
}

.modal-overlay{position:fixed;inset:0;background:rgba(8,5,4,0.78);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal-overlay.hidden{display:none;}
.modal{
  background:var(--bg-elev);border:1.5px solid var(--line-strong);border-radius:16px 16px 0 0;

/* MOTOR DE AUDIO */
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  return audioCtx;
}
function playDiceRollSound(){
  var ctx = getAudioCtx(); if(!ctx) return;
  var now = ctx.currentTime;
  for(var i=0;i<7;i++){
    var t = now + i*0.055 + Math.random()*0.02;
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(220 + Math.random()*340, t);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+0.06);
  }
}
function playCritSound(){
  var ctx = getAudioCtx(); if(!ctx) return;
  var now = ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.50].forEach(function(f, idx){
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(f, now + idx*0.04);
    gain.gain.setValueAtTime(0.001, now + idx*0.04);
    gain.gain.exponentialRampToValueAtTime(0.24, now + idx*0.04 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx*0.04 + 0.55);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now + idx*0.04); osc.stop(now + idx*0.04 + 0.6);
  });
}
function playFumbleSound(){
  var ctx = getAudioCtx(); if(!ctx) return;
  var now = ctx.currentTime;
  [311.13, 293.66, 277.18, 220].forEach(function(f, idx){
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(f, now + idx*0.07);
    gain.gain.setValueAtTime(0.001, now + idx*0.07);
    gain.gain.exponentialRampToValueAtTime(0.18, now + idx*0.07 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx*0.07 + 0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now + idx*0.07); osc.stop(now + idx*0.07 + 0.4);
  });
}

function openRollModal(label, scoreText, detailHtml, sides, isCrit, isFumble, advCardsHtml){
  document.getElementById("rollLabel").textContent = label;
  var container = document.getElementById("rollDieGraphic");
  var reveal = document.getElementById("rollReveal");
  var scoreEl = document.getElementById("rollScore");
  var verdictEl = document.getElementById("rollVerdict");
  var advEl = document.getElementById("rollAdvVisual");

  container.innerHTML = getDieSvg(sides);
  scoreEl.textContent = scoreText;
  scoreEl.className = "roll-score" + (isCrit?" crit":isFumble?" fumble":"");
  verdictEl.textContent = isCrit ? "¡CRÍTICO!" : (isFumble ? "¡PIFIA!" : "");
  verdictEl.className = "roll-verdict" + (isCrit?" crit":isFumble?" fumble":"");
  advEl.innerHTML = advCardsHtml || "";
  document.getElementById("rollDetail").innerHTML = detailHtml;

  reveal.style.opacity = "0";
  container.classList.remove("spinning");
  void container.offsetWidth;
  container.classList.add("spinning");
  document.getElementById("rollOverlay").classList.remove("hidden");
  playDiceRollSound();
  setTimeout(function(){
    container.classList.remove("spinning");
    reveal.style.opacity = "1";
    if(isCrit) playCritSound();
    else if(isFumble) playFumbleSound();
  }, 480);
}

function performD10Roll(charName, label, mod){
  var c = activeChar();
  var extraMod = 0;
  if(c.buffs){
    if(c.buffs.sangre_ataque_melee && label.includes("melé")) extraMod += 1;
    if(c.buffs.sangre_ataque_dist && label.includes("distancia")) extraMod += 1;
    if(c.buffs.mono) extraMod -= 1;
  }
  var d = rollDie(10);
  var total = d + num(mod,0) + extraMod;
  var detail = "1d10 ("+d+") + "+(num(mod,0)+extraMod);
  var isCrit = d===10, isFumble = d===1;
  state.rollLog.unshift({id:uid(), charName:charName, label:label, total:total, formulaText:detail, ts:Date.now()});
  if(state.rollLog.length>20) state.rollLog.length=20;
  saveState();
  openRollModal(label, total, "<div>"+esc(detail)+"</div>", 10, isCrit, isFumble);
  renderTab();
}

function performWeaponRoll(charName, weaponName, formulaRaw){
  var m = String(formulaRaw||"").match(/(\d+)\s*[dD]\s*(\d+)/);
  if(!m){ alert("Fórmula de daño no válida (ej: 1D6+3)"); return; }
  var qty = parseInt(m[1],10), sides = parseInt(m[2],10);
  var rest = String(formulaRaw).slice(m.index + m[0].length);
  var modM = rest.match(/^\s*([+-]\s*\d+)/);
  var mod = modM ? parseInt(modM[1].replace(/\s+/g,""),10) : 0;
  var rolls=[], sum=0;
  for(var i=0;i<qty;i++){ var r=rollDie(sides); rolls.push(r); sum+=r; }
  var isCrit = rolls.every(function(r){return r===sides;});
  var isFumble = rolls.every(function(r){return r===1;});
  var total = sum + mod;
  var detail = qty+"d"+sides+" ("+rolls.join("+")+")"+(mod?(mod>0?" + "+mod:" - "+Math.abs(mod)):"");
  openRollModal("Daño — "+weaponName, total, "<div>"+esc(detail)+"</div>", sides, isCrit, isFumble);
}

function tplHabilidades(c){
  var groups = {}; ATTRS.forEach(function(a){groups[a]=[];});
  var hybrids = [];
  SKILL_DEFS.forEach(function(s){ if(s.attr==="hybrid") hybrids.push(s); else groups[s.attr].push(s); });

  var skillBanner = "";
  if(num(c.skillPoints,0) > 0){
    skillBanner = '<div class="skill-pool-banner"><span>Puntos de habilidad disponibles: <b>'+c.skillPoints+'</b></span></div>';
  }

  var html = '<div class="section"><div class="section-title"><span>Habilidades Generales</span></div>'+skillBanner;
  ATTRS.forEach(function(a){
    html += '<div class="attr-group"><div class="attr-group-title">'+ATTR_LABELS[a]+'</div>';
    html += '<div class="skill-col-headers"><span>Habilidad</span><span>Base</span><span>Bono</span><span>Total</span><span></span></div>';
    groups[a].forEach(function(s){ html += skillRowHtml(s,c); });
    html += '</div>';
  });
  html += '<div class="attr-group"><div class="attr-group-title">Híbridas</div>';
  html += '<div class="skill-col-headers"><span>Habilidad</span><span>Base</span><span>Bono</span><span>Total</span><span></span></div>';
  hybrids.forEach(function(s){ html += skillRowHtml(s,c,true); });
  html += '</div>';

  if(c.customSkills && c.customSkills.length){
    html += '<div class="attr-group"><div class="attr-group-title">Personalizadas</div>';
    html += '<div class="skill-col-headers"><span>Habilidad</span><span>Base</span><span>Bono</span><span>Total</span><span></span></div>';
    c.customSkills.forEach(function(cs){
      html += '<div class="skill-row"><span>'+esc(cs.name)+' <small style="color:var(--ink-faint);">('+ATTR_LABELS[cs.attr].slice(0,3)+')</small></span><span class="skill-base">'+getEffectiveAttr(cs.attr,c)+'</span>'+
        '<span class="skill-bonus-ctrl">'+
          '<button data-action="skill-sub-custom" data-id="'+cs.id+'">-</button>'+
          '<span>'+num(cs.bonus,0)+'</span>'+
          '<button data-action="skill-add-custom" data-id="'+cs.id+'">+</button>'+

    });
    html += '</div>';
  }
  html += '<button class="add-row-btn" data-action="add-custom-skill">+ Añadir habilidad personalizada</button></div>';
  html += rollLogHtml();
  return html;

function setBind(target, path, rawValue, inputType){
  var parts = path.split(".");
  var value = inputType==="number" ? num(rawValue,0) : rawValue;
  if(parts.length===1){ target[parts[0]] = value; return; }
  if(parts[0]==="attrs"){ target.attrs[parts[1]] = value; return; }
  if(parts[0]==="combat"){ target.combat[parts[1]] = value; return; }
  if(parts[0]==="money"){ target.money[parts[1]] = value; return; }
  if(parts[0]==="skillBonus"){ target.skillBonus[parts[1]] = value; return; }
  if(parts[0]==="skillHybrid"){ target.skillHybrid[parts[1]] = value; return; }
  if(parts[0]==="customSkills"){
    var cs = target.customSkills.find(function(x){return x.id===parts[1];});
    if(cs) cs[parts[2]] = value;
    return;
  }
  var listFields = ["weapons","armors","inventory","spells","stones","passivesNeg","passivesPos","goddessCurses","goddessBlessings","goddessTable","customBuffs","summons","bestiary","poisons"];
  if(listFields.indexOf(parts[0])!==-1){
    var arr = target[parts[0]];
    var item = arr && arr.find(function(x){return x.id===parts[1];});
    if(item) item[parts[2]] = value;
    return;
  }
  if(parts[0]==="lore"){
    var loreArr = target.lore[parts[1]];
    var lItem = loreArr && loreArr.find(function(x){return x.id===parts[2];});
    if(lItem) lItem[parts[3]] = value;
    return;
  }
  target[path] = value;
}

function handleChange(e){
  var el = e.target.closest("[data-bind]"); if(!el) return;
  var isGlobal = el.getAttribute("data-scope")==="global";
  var target = isGlobal ? state : activeChar();
  setBind(target, el.getAttribute("data-bind"), el.value, el.type);
  saveState();
  renderTopbar();
  renderTab();
}

function handleClick(e){
  getAudioCtx();
  var btn = e.target.closest("[data-action]"); if(!btn) return;
  var action = btn.getAttribute("data-action");
  var c = activeChar();

  if(action==="set-bestiary-continent"){ bestiaryContinentFilter = btn.getAttribute("data-continent"); renderTab(); return; }
  if(action==="set-lore-continent"){ loreContinentFilter = btn.getAttribute("data-continent"); renderTab(); return; }
  if(action==="set-lore-type"){ loreTypeFilter = btn.getAttribute("data-type"); renderTab(); return; }
  if(action==="set-lore-terrain"){ loreTerrainFilter = btn.getAttribute("data-terrain"); renderTab(); return; }
  if(action==="set-lore-subtab"){ currentLoreSubtab = btn.getAttribute("data-subtab"); renderTab(); return; }

  if(action==="switch-tab"){ state.activeTab = btn.getAttribute("data-tab"); saveState(); renderTabbar(); renderTab(); return; }
  if(action==="hp-delta"){
    var d1 = parseInt(btn.getAttribute("data-delta"),10);
    c.combat.pvActual = clamp(num(c.combat.pvActual,0)+d1, 0, Math.max(0,num(c.combat.pvMax,0))||9999);
    saveState(); renderTopbar(); return;
  }
  if(action==="shield-delta"){

function openDiceModal(){
  document.getElementById("diceModal").innerHTML = diceModalHtml();
  document.getElementById("diceModalOverlay").classList.remove("hidden");
}
function diceModalClick(e){
  var btn = e.target.closest("[data-action]"); if(!btn) return;
  var action = btn.getAttribute("data-action");
  if(action==="close-modal"){ closeModals(); return; }
  if(action==="pick-die"){ diceState.sides = parseInt(btn.getAttribute("data-sides"),10); openDiceModal(); return; }
  if(action==="roll-free"){
    diceState.mod = parseInt(document.getElementById("diceMod").value,10)||0;
    diceState.mode = document.getElementById("diceMode").value;

    document.getElementById("diceModalOverlay").classList.add("hidden");

    if(diceState.sides===100){
      var t = (rollDie(10)-1)*10, u = rollDie(10)-1;
      var pct = t+u === 0 ? 100 : t+u;
      var tot = pct + diceState.mod;
      openRollModal("d% (Percentil)", tot, "<div>Decenas "+t+" + Unidades "+u+"</div>", 100, pct===100, pct===1);
      return;
    }

    if(diceState.mode==="adv" || diceState.mode==="disadv"){
      var r1 = rollDie(diceState.sides), r2 = rollDie(diceState.sides);
      var chosen = diceState.mode==="adv" ? Math.max(r1, r2) : Math.min(r1, r2);
      var totAdv = chosen + diceState.mod;
      var lblAdv = "d"+diceState.sides + (diceState.mode==="adv"?" (Ventaja)":" (Desventaja)");
      var detAdv = "Modificador: "+(diceState.mod>=0?"+"+diceState.mod:diceState.mod);
      var advHtml = '<div class="adv-dice-wrap">'+
        '<div class="adv-die-card '+(r1===chosen?'chosen':'discarded')+'">'+r1+'</div>'+
        '<div class="adv-die-card '+(r2===chosen && r1!==r2?'chosen':(r1===r2?'chosen':'discarded'))+'">'+r2+'</div>'+
      '</div>';
      openRollModal(lblAdv, totAdv, "<div>"+detAdv+"</div>", diceState.sides, chosen===diceState.sides, chosen===1, advHtml);
      return;
    }

    diceState.qty = Math.max(1, parseInt((document.getElementById("diceQty")||{}).value,10)||1);
    var rolls=[], sum=0;
    for(var i=0;i<diceState.qty;i++){ var r=rollDie(diceState.sides); rolls.push(r); sum+=r; }
    var isCrit = rolls.every(function(r){return r===diceState.sides;});
    var isFumble = rolls.every(function(r){return r===1;});
    var total = sum + diceState.mod;
    openRollModal(diceState.qty+"d"+diceState.sides, total, "<div>("+rolls.join("+")+")"+(diceState.mod?(diceState.mod>0?" + "+diceState.mod:" - "+Math.abs(diceState.mod)):"")+"</div>", diceState.sides, isCrit, isFumble);
    return;
  }
}

function exportData(){

function importData(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      state = migrateState(JSON.parse(r.result));
      state.activeId = state.characters[0]?state.characters[0].id:"";
      saveState(); closeModals(); renderTopbar(); renderTabbar(); renderTab();
    }catch(e){ alert("Archivo no válido."); }
  };
  r.readAsText(file);
}

function resizeImageFile(file, maxDim, quality, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxDim/Math.max(img.width,img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL("image/jpeg", quality||0.75));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function initSupabase(){

  try{
    supabaseClient = window.supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_KEY);
    supabaseClient.auth.getSession().then(function(res){
      if(res.data && res.data.session){ currentUser = res.data.session.user; fetchUserProfile(); }
    }).catch(function(){});
    supabaseClient.auth.onAuthStateChange(function(e, session){
      currentUser = session ? session.user : null;
      if(currentUser){ fetchUserProfile(); } else { currentRole='player'; setSyncStatus("local"); renderTopbar(); renderTab(); }
    });
  }catch(e){}
}
async function fetchUserProfile(){
  if(!supabaseClient || !currentUser) return;
  try{
    var res = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
    if(res.data && res.data.role) currentRole = res.data.role;
    pullAllFromSupabase();
    pullMapFromSupabase();
    supabaseClient.channel('realtime_all')
      .on('postgres_changes', {event:'*', schema:'public', table:'characters'}, function(){ pullAllFromSupabase(); })
      .on('postgres_changes', {event:'*', schema:'public', table:'campaign_map'}, function(){ pullMapFromSupabase(); })
      .subscribe();
  }catch(e){}
  renderTopbar();
}
async function supabaseLogin(em, pw){
  var res = await supabaseClient.auth.signInWithPassword({email:em, password:pw});
  if(res.error) alert(res.error.message); else closeModals();
}
async function supabaseSignup(em, pw){
  var res = await supabaseClient.auth.signUp({email:em, password:pw});
  if(res.error) alert(res.error.message); else alert("Registro completado. Ya puedes entrar.");
}
async function supabaseLogout(){
  await supabaseClient.auth.signOut(); currentUser=null; currentRole='player'; closeModals(); setSyncStatus("local"); renderTopbar(); renderTab();
}
async function pullAllFromSupabase(){
  if(!supabaseClient || !currentUser) return;
  isRemoteSyncing = true;
  try{
    var charRes = await supabaseClient.from('characters').select('*');
    if(charRes.data && charRes.data.length){
      state.characters = charRes.data.map(function(r){ var c = r.data; c.db_id = r.id; return c; });
      if(!state.activeId && state.characters.length) state.activeId = state.characters[0].id;
      setSyncStatus("synced");
    }
    saveState(true); renderTopbar(); renderTabbar(); renderTab();
  }catch(e){}
  isRemoteSyncing = false;
}
function pushCurrentCharToSupabase(){
  if(!supabaseClient || !currentUser) return;
  var c = activeChar(); if(!c || !c.name || c.id==="empty") return;
  var payload = {name:c.name, data:c, owner_id:currentUser.id, updated_at:new Date().toISOString()};
  if(c.db_id) payload.id = c.db_id;
  supabaseClient.from('characters').upsert(payload).then(function(res){
    if(res.data && res.data[0]) c.db_id = res.data[0].id;
    setSyncStatus("synced");
  });
}
async function pullMapFromSupabase(){
  if(!supabaseClient) return;
  try{
    var res = await supabaseClient.from('campaign_map').select('*').eq('id', 'main_map').maybeSingle();
    if(res.data){
      if(res.data.image_url) state.mapImage = res.data.image_url;
      if(res.data.markers) state.mapMarkers = res.data.markers;
      saveState(true);
      if(state.activeTab==="mundo") renderTab();
    }
  }catch(e){}
}
function pushMapToSupabase(){
  if(!supabaseClient || !currentUser) return;
  supabaseClient.from('campaign_map').upsert({
    id: 'main_map',
    image_url: state.mapImage,
    markers: state.mapMarkers||[],
    updated_at: new Date().toISOString()
  }).then(function(){ setSyncStatus("synced"); });
}

function init(){
  state = loadState();
  renderTopbar();
  renderTabbar();
  renderTab();

  document.getElementById("main").addEventListener("click", handleClick);
  document.getElementById("main").addEventListener("change", handleChange);
  document.getElementById("main").addEventListener("input", function(e){
    var el = e.target.closest("[data-bind]"); if(!el) return;
    var isGlobal = el.getAttribute("data-scope")==="global";
    var target = isGlobal ? state : activeChar();
    setBind(target, el.getAttribute("data-bind"), el.value, el.type);
    saveState();
  });
  document.getElementById("topbar").addEventListener("click", handleClick);
  document.getElementById("tabbar").addEventListener("click", handleClick);
  document.getElementById("charModal").addEventListener("click", modalClick);
  document.getElementById("dataModal").addEventListener("click", modalClick);
  document.getElementById("diceModal").addEventListener("click", diceModalClick);
  document.getElementById("pinModal").addEventListener("click", pinModalClick);
  document.getElementById("charModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeModals(); });
  document.getElementById("dataModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeModals(); });
  document.getElementById("diceModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeModals(); });
  document.getElementById("pinModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeModals(); });
  
  document.getElementById("btnRollClose").addEventListener("click", function(){
    document.getElementById("rollOverlay").classList.add("hidden");
  });
  document.getElementById("rollOverlay").addEventListener("click", function(e){
    if(e.target===this) this.classList.add("hidden");
  });

  document.getElementById("fabDice").addEventListener("click", openDiceModal);
  document.getElementById("portraitFileInput").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]){
      resizeImageFile(e.target.files[0], 400, 0.85, function(url){ activeChar().portrait = url; saveState(); renderTopbar(); renderTab(); });
    }
    e.target.value="";
  });
  document.getElementById("mapFileInput").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]){
      resizeImageFile(e.target.files[0], 1200, 0.75, function(url){
        state.mapImage = url;
        saveState();
        pushMapToSupabase();
        renderTab();
      });
    }
    e.target.value="";
  });
  document.getElementById("importFileInput").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]) importData(e.target.files[0]);
    e.target.value="";
  });

  initSupabase();
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
</body>
</html>
