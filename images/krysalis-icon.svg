<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#261A12" />
      <stop offset="70%" stop-color="#160F0B" />
      <stop offset="100%" stop-color="#0E0907" />
    </radialGradient>
    <radialGradient id="gemGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF9AA4" />
      <stop offset="35%" stop-color="#C84B57" />
      <stop offset="75%" stop-color="#8C252F" />
      <stop offset="100%" stop-color="#3D0C11" />
    </radialGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DEC392" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#8C252F" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#120D0A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="20%" stop-color="#DEC392" />
      <stop offset="60%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#6E4F23" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E3310" />
      <stop offset="50%" stop-color="#8C6934" />
      <stop offset="100%" stop-color="#DEC392" />
    </linearGradient>
    <filter id="runeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular tipo medallón / sello arcano -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGlow)" />
  <circle cx="100" cy="100" r="97" stroke="url(#goldDark)" stroke-width="2.5" fill="none" />
  <circle cx="100" cy="100" r="93" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 3" fill="none" opacity="0.75" />

  <!-- Resplandor místico -->
  <circle cx="100" cy="100" r="88" fill="url(#centerAura)" />

  <!-- Anillos concéntricos ornamentales -->
  <circle cx="100" cy="100" r="86" stroke="url(#goldDark)" stroke-width="1.4" stroke-dasharray="5 3" opacity="0.6" />
  <circle cx="100" cy="100" r="80" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9" />
  <circle cx="100" cy="100" r="74" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />

  <!-- Ticks cardinales de compás / astrolabio -->
  <polygon points="100,7 103,17 100,15 97,17" fill="url(#goldGrad)" />
  <polygon points="100,193 103,183 100,185 97,183" fill="url(#goldGrad)" />
  <polygon points="7,100 17,103 15,100 17,97" fill="url(#goldGrad)" />
  <polygon points="193,100 183,103 185,100 183,97" fill="url(#goldGrad)" />

  <!-- Puntos cardinales diagonales -->
  <circle cx="37" cy="37" r="2.2" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="163" cy="37" r="2.2" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="37" cy="163" r="2.2" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="163" cy="163" r="2.2" fill="url(#goldGrad)" opacity="0.8" />

  <!-- ================= RUNAS DE KRYSALIS ================= -->
  <!-- Gancho Superior Izquierdo -->
  <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
    stroke="#C84B57" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.45" />
  <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
    stroke="url(#goldDark)" stroke-width="4.8" stroke-linecap="round" fill="none" />
  <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
    stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
    stroke="#FFFDF6" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Gancho Inferior Derecho (Rotación 180°) -->
  <g transform="rotate(180 100 100)">
    <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
      stroke="#C84B57" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.45" />
    <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
      stroke="url(#goldDark)" stroke-width="4.8" stroke-linecap="round" fill="none" />
    <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
      stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
      stroke="#FFFDF6" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>

  <!-- Gemas de Rubí / Medallones -->
  <!-- Superior Derecho (124, 70) -->
  <circle cx="124" cy="70" r="14" fill="#140E0B" stroke="#C84B57" stroke-width="2.5" opacity="0.5" />
  <circle cx="124" cy="70" r="13" fill="#140E0B" stroke="url(#goldGrad)" stroke-width="2.4" />
  <circle cx="124" cy="70" r="8.8" fill="url(#gemGrad)" stroke="url(#goldDark)" stroke-width="1" />
  <circle cx="121.5" cy="67.5" r="2.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="126.8" cy="72.8" r="1" fill="#FFA5AE" opacity="0.65" />

  <!-- Inferior Izquierdo (76, 130) -->
  <g transform="rotate(180 100 100)">
    <circle cx="124" cy="70" r="14" fill="#140E0B" stroke="#C84B57" stroke-width="2.5" opacity="0.5" />
    <circle cx="124" cy="70" r="13" fill="#140E0B" stroke="url(#goldGrad)" stroke-width="2.4" />
    <circle cx="124" cy="70" r="8.8" fill="url(#gemGrad)" stroke="url(#goldDark)" stroke-width="1" />
    <circle cx="121.5" cy="67.5" r="2.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="126.8" cy="72.8" r="1" fill="#FFA5AE" opacity="0.65" />
  </g>

  <!-- Nexo Central -->
  <circle cx="100" cy="100" r="4.6" fill="url(#gemGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
  <circle cx="98.5" cy="98.5" r="1.3" fill="#FFFFFF" opacity="0.95" />
  <polygon points="100,91.5 101.8,98.8 108.5,100 101.8,101.2 100,108.5 98.2,101.2 91.5,100 98.2,98.8" fill="url(#goldGrad)" opacity="0.85" />
</svg>
