<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 200 200" fill="none">
  <g opacity="0.065">
    <!-- Anillos concéntricos -->
    <circle cx="100" cy="100" r="88" stroke="#B08D57" stroke-width="1.4" stroke-dasharray="4 4" />
    <circle cx="100" cy="100" r="82" stroke="#B08D57" stroke-width="2" />
    <circle cx="100" cy="100" r="76" stroke="#B08D57" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Ticks cardinales de compás / astrolabio -->
    <polygon points="100,6 103,17 100,15 97,17" fill="#B08D57" />
    <polygon points="100,194 103,183 100,185 97,183" fill="#B08D57" />
    <polygon points="6,100 17,103 15,100 17,97" fill="#B08D57" />
    <polygon points="194,100 183,103 185,100 183,97" fill="#B08D57" />

    <!-- Puntos cardinales diagonales -->
    <circle cx="38" cy="38" r="1.8" fill="#B08D57" />
    <circle cx="162" cy="38" r="1.8" fill="#B08D57" />
    <circle cx="38" cy="162" r="1.8" fill="#B08D57" />
    <circle cx="162" cy="162" r="1.8" fill="#B08D57" />

    <!-- Ganchos curvos de Krysalis -->
    <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
      stroke="#B08D57" stroke-width="3.5" stroke-linecap="round" />

    <g transform="rotate(180 100 100)">
      <path d="M 66 22 C 65 42, 75 64, 86 80 C 90 90, 84 98, 74 99 C 60 100, 48 91, 44 78"
        stroke="#B08D57" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Puntos rojos con anillos dorados -->
    <!-- Superior Derecho -->
    <circle cx="124" cy="70" r="12" stroke="#B08D57" stroke-width="2" />
    <circle cx="124" cy="70" r="7.5" fill="#8C252F" />

    <!-- Inferior Izquierdo (Rotación 180°) -->
    <circle cx="76" cy="130" r="12" stroke="#B08D57" stroke-width="2" />
    <circle cx="76" cy="130" r="7.5" fill="#8C252F" />

    <!-- Nexo Central -->
    <circle cx="100" cy="100" r="3.5" fill="#B08D57" />
    <polygon points="100,93 102,99 107,100 102,101 100,107 98,101 93,100 98,99" fill="#B08D57" />
  </g>
</svg>
